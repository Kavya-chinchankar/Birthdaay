<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Make a Wish</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f6f1e7;
        --ivory-dim: #e3cfc6;
        --ink: #2b0a10;
        --gold: #d8b45c;
        --gold-soft: #f0d99a;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Lora", Georgia, serif;
        color: var(--ivory);
        height: 100dvh;
        padding: 2vh 20px;
        background: linear-gradient(
          135deg,
          #3a0711,
          #6a1020,
          #4a0a16,
          #7a1626,
          #3a0711
        );
        background-size: 400% 400%;
        background-attachment: fixed;
        animation: bg 22s ease-in-out infinite;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      @keyframes bg {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 380px;
        height: 380px;
        background: rgba(216, 180, 92, 0.2);
        top: -110px;
        left: -90px;
        animation: orb1 14s ease-in-out infinite;
      }
      body::after {
        width: 440px;
        height: 440px;
        background: rgba(200, 50, 70, 0.28);
        bottom: -150px;
        right: -110px;
        animation: orb2 17s ease-in-out infinite;
      }
      @keyframes orb1 {
        50% {
          transform: translate(90px, 70px);
        }
      }
      @keyframes orb2 {
        50% {
          transform: translate(-90px, -60px);
        }
      }
      #spot {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          420px circle at var(--mx, 70%) var(--my, 40%),
          rgba(255, 190, 120, 0.2),
          transparent 60%
        );
      }
      #sparks {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      }

      /* ---------- layout: details LEFT, photos RIGHT ---------- */
      .stage {
        position: relative;
        z-index: 1;
        height: 100%;
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 4vw;
      }
      .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 0;
      }
      .right {
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 900px;
        min-height: 0;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .view {
        display: none;
        width: 100%;
        max-width: 380px;
      }
      .view.active {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .view.active > * {
        animation: in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .view.active > *:nth-child(2) {
        animation-delay: 0.12s;
      }
      .view.active > *:nth-child(3) {
        animation-delay: 0.24s;
      }
      .view.active > *:nth-child(4) {
        animation-delay: 0.36s;
      }
      .view.active > *:nth-child(5) {
        animation-delay: 0.48s;
      }

      .crest {
        width: clamp(30px, 6vh, 50px);
        height: clamp(30px, 6vh, 50px);
        margin-bottom: clamp(4px, 1.2vh, 12px);
        animation:
          in 0.9s both,
          glow 3s ease-in-out infinite;
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 10px rgba(240, 217, 154, 0.95));
        }
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.8rem, min(5.2vw, 6.4vh), 3.4rem);
        line-height: 1.1;
        margin: 0 0 1vh;
        background: linear-gradient(
          100deg,
          var(--ivory) 30%,
          var(--gold-soft) 50%,
          var(--ivory) 70%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          in 0.9s both,
          shine 5s linear infinite;
      }
      @keyframes shine {
        from {
          background-position: 120% 0;
        }
        to {
          background-position: -120% 0;
        }
      }
      .sub {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-size: clamp(1.05rem, min(4.6vw, 3.2vh), 1.5rem);
        color: var(--ivory-dim);
        margin: 0 0 clamp(8px, 2.2vh, 20px);
        min-height: 1.3em;
      }
      #tw::after {
        content: "|";
        margin-left: 2px;
        animation: blink 1s steps(1) infinite;
        color: var(--gold-soft);
      }
      #tw.done::after {
        display: none;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* PIN dots */
      .dots {
        display: flex;
        gap: clamp(12px, 3vh, 20px);
        justify-content: center;
        margin: 0 0 clamp(8px, 2.2vh, 20px);
        height: clamp(14px, 2.6vh, 22px);
      }
      .dot {
        width: clamp(14px, 2.6vh, 22px);
        height: clamp(14px, 2.6vh, 22px);
        border-radius: 50%;
        border: 2px solid var(--gold);
        transition:
          background 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .dot.on {
        background: var(--gold-soft);
        transform: scale(1.15);
        box-shadow: 0 0 14px rgba(240, 217, 154, 0.8);
      }
      .dots.shake {
        animation: shake 0.45s;
      }
      @keyframes shake {
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-5px);
        }
        80% {
          transform: translateX(5px);
        }
      }

      /* keypad */
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(7px, 1.5vh, 14px);
        width: min(320px, 100%);
        padding: clamp(10px, 2vh, 18px);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(240, 217, 154, 0.45);
        border-radius: 28px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .key {
        font: inherit;
        font-weight: 600;
        font-size: clamp(1.3rem, 3.9vh, 1.9rem);
        height: clamp(40px, 7vh, 64px);
        color: var(--ivory);
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(240, 217, 154, 0.6);
        border-radius: 40px;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      .key:hover {
        background: rgba(216, 180, 92, 0.25);
      }
      .key:active,
      .key.hit {
        background: linear-gradient(100deg, var(--gold), var(--gold-soft));
        color: var(--ink);
        transform: scale(0.94);
      }
      .key.fn {
        font-size: clamp(1rem, 2.8vh, 1.3rem);
        color: var(--gold-soft);
      }
      .key:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
      .hint {
        margin: clamp(8px, 2vh, 18px) 0 0;
        font-size: clamp(0.9rem, 2.3vh, 1.05rem);
        color: var(--ivory-dim);
        font-style: italic;
      }
      .msg {
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        line-height: 1.7;
        margin: 0 0 clamp(12px, 3vh, 26px);
      }
      button.main {
        font: inherit;
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        padding: clamp(11px, 2vh, 16px) 40px;
        cursor: pointer;
        letter-spacing: 0.05em;
        color: var(--ivory);
        background: transparent;
        border: 2px solid var(--gold);
        border-radius: 40px;
        transition: background 0.2s;
      }
      button.main:hover {
        background: rgba(216, 180, 92, 0.22);
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      /* photos */
      .duo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      .frame {
        width: clamp(100px, min(21vw, 42vh), 265px);
        aspect-ratio: 132/170;
        background: linear-gradient(160deg, var(--gold-soft), var(--gold));
        padding: 6px;
        border-radius: 200px 200px 8px 8px;
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.5),
          0 0 32px rgba(216, 180, 92, 0.35);
        transition: transform 0.15s ease-out;
        will-change: transform;
        animation: in 1.1s both;
      }
      .frame .ph {
        width: 100%;
        height: 100%;
        border-radius: 200px 200px 3px 3px;
        overflow: hidden;
        background: #5a1020;
      }
      .frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .f1 {
        margin-bottom: 12vh;
      }
      .f2 {
        margin-top: 12vh;
        animation-delay: 0.25s;
      }
      .heart {
        width: clamp(28px, 6vh, 50px);
        height: clamp(28px, 6vh, 50px);
        flex: none;
        margin: 0 clamp(-14px, -1.6vw, -6px);
        z-index: 2;
        filter: drop-shadow(0 0 10px rgba(255, 120, 140, 0.7));
        animation: beat 1.6s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.28);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.2);
        }
      }

      /* ---------- mobile: photos on top, details below ---------- */
      @media (max-width: 820px) {
        body {
          padding: 1.6vh 14px;
        }
        .stage {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          gap: 1.2vh;
          align-content: center;
        }
        .right {
          order: -1;
        }
        .left {
          justify-content: center;
        }
        .frame {
          width: clamp(76px, min(38vw, 19vh), 175px);
        }
        .f1 {
          margin-bottom: 3vh;
        }
        .f2 {
          margin-top: 3vh;
        }
        .crest {
          display: none;
        }
        h1 {
          font-size: clamp(1.6rem, min(8.5vw, 5vh), 2.6rem);
        }
      }
      @media (max-height: 560px) and (max-width: 820px) {
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        body::before,
        body::after {
          animation: none !important;
        }
        #sparks,
        #spot {
          display: none;
        }
      }
      /* ---------- extra animation ---------- */
      .pad .key {
        animation: keyin 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.3) backwards;
      }
      .pad .key:nth-child(1) {
        animation-delay: 0.55s;
      }
      .pad .key:nth-child(2) {
        animation-delay: 0.6s;
      }
      .pad .key:nth-child(3) {
        animation-delay: 0.65s;
      }
      .pad .key:nth-child(4) {
        animation-delay: 0.7s;
      }
      .pad .key:nth-child(5) {
        animation-delay: 0.75s;
      }
      .pad .key:nth-child(6) {
        animation-delay: 0.8s;
      }
      .pad .key:nth-child(7) {
        animation-delay: 0.85s;
      }
      .pad .key:nth-child(8) {
        animation-delay: 0.9s;
      }
      .pad .key:nth-child(9) {
        animation-delay: 0.95s;
      }
      .pad .key:nth-child(10) {
        animation-delay: 1s;
      }
      .pad .key:nth-child(11) {
        animation-delay: 1.05s;
      }
      .pad .key:nth-child(12) {
        animation-delay: 1.1s;
      }
      @keyframes keyin {
        from {
          opacity: 0;
          transform: scale(0.5) translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .key {
        position: relative;
        overflow: hidden;
      }
      .key .rp {
        position: absolute;
        border-radius: 50%;
        background: rgba(240, 217, 154, 0.55);
        transform: scale(0);
        animation: rp 0.6s ease-out forwards;
        pointer-events: none;
      }
      @keyframes rp {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .dot.on {
        animation: pop 0.35s cubic-bezier(0.2, 0.8, 0.3, 1.6);
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
        }
        100% {
          transform: scale(1.15);
        }
      }
      .dots.bad .dot {
        border-color: #ff8f9c;
        background: #c0394d;
        box-shadow: 0 0 14px rgba(255, 100, 120, 0.8);
      }
      .view.active > .hint {
        animation:
          in 0.9s 0.6s both,
          hintpulse 3.2s 1.8s ease-in-out infinite;
      }
      @keyframes hintpulse {
        50% {
          opacity: 0.6;
        }
      }
      .frame {
        position: relative;
        overflow: hidden;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-130%);
        animation: sweep 6s ease-in-out infinite;
        pointer-events: none;
      }
      .f2::after {
        animation-delay: 1.2s;
      }
      @keyframes sweep {
        0%,
        60% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(130%);
        }
      }
      .fh {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        font-size: 18px;
        color: #ff8fa3;
        animation: fh 3.2s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 120, 140, 0.8);
      }
      @keyframes fh {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), -26vh) scale(1.2);
        }
      }
      .lock {
        width: clamp(54px, 11vh, 90px);
        height: clamp(54px, 11vh, 90px);
        margin-bottom: clamp(6px, 2vh, 16px);
        filter: drop-shadow(0 0 12px rgba(240, 217, 154, 0.8));
      }
      .shackle {
        transform-box: fill-box;
        transform-origin: 100% 100%;
        animation: unlock 0.9s 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) forwards;
      }
      @keyframes unlock {
        to {
          transform: translateY(-8px) rotate(-28deg);
        }
      }
      a.main {
        display: inline-block;
        text-decoration: none;
        font: inherit;
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        padding: clamp(12px, 2.2vh, 17px) 38px;
        margin-top: clamp(10px, 2.4vh, 22px);
        letter-spacing: 0.05em;
        color: var(--ink);
        background: linear-gradient(
          100deg,
          var(--gold) 0%,
          var(--gold-soft) 45%,
          var(--gold) 90%
        );
        background-size: 220% 100%;
        border-radius: 40px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .view.active > a.main {
        animation:
          in 0.9s 0.7s both,
          sheen 4s 1.6s ease-in-out infinite,
          pulse 2.2s 1.6s ease-out infinite;
      }
      a.main:hover {
        transform: translateY(-2px);
      }
      a.main:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      @keyframes sheen {
        50% {
          background-position: 100% 0;
        }
      }
      @keyframes pulse {
        0% {
          box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.35),
            0 0 0 0 rgba(240, 217, 154, 0.7);
        }
        100% {
          box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.35),
            0 0 0 22px rgba(240, 217, 154, 0);
        }
      }
      #open {
        max-width: 480px;
      }
      .bloom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.6vw, 16px);
        width: 100%;
      }
      .bloom h1 {
        margin: 0;
      }
      .rose {
        width: clamp(48px, 11vh, 92px);
        height: clamp(48px, 11vh, 92px);
        flex: none;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45))
          drop-shadow(0 0 12px rgba(200, 60, 80, 0.5));
        transform-origin: 50% 90%;
        animation:
          bloomin 1.3s 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.35) backwards,
          sway 4.5s 1.9s ease-in-out infinite;
      }
      .r2 {
        animation-delay: 0.7s, 2.1s;
      }
      @keyframes bloomin {
        from {
          opacity: 0;
          transform: scale(0) rotate(-40deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }
      .r2 {
        animation-direction: normal, reverse;
      }
      /* ---------- bigger left side ---------- */
      .view {
        max-width: 460px;
      }
      #open {
        max-width: 560px;
      }
      .crest {
        width: clamp(34px, 7vh, 58px);
        height: clamp(34px, 7vh, 58px);
      }
      h1 {
        font-size: clamp(2rem, min(5.8vw, 7.4vh), 3.9rem);
      }
      .sub {
        font-size: clamp(1.15rem, min(4.8vw, 3.7vh), 1.75rem);
      }
      .dots {
        gap: clamp(12px, 3.2vh, 24px);
        height: clamp(16px, 3vh, 26px);
      }
      .dot {
        width: clamp(16px, 3vh, 26px);
        height: clamp(16px, 3vh, 26px);
      }
      .pad {
        width: min(400px, 100%);
        gap: clamp(8px, 1.7vh, 16px);
        padding: clamp(12px, 2.3vh, 22px);
      }
      .key {
        height: clamp(44px, 8vh, 74px);
        font-size: clamp(1.45rem, 4.5vh, 2.2rem);
      }
      .key.fn {
        font-size: clamp(1.05rem, 3.1vh, 1.45rem);
      }
      .hint {
        font-size: clamp(1rem, 2.6vh, 1.2rem);
      }
      @media (max-width: 820px) {
        .view {
          max-width: 420px;
        }
        h1 {
          font-size: clamp(1.8rem, min(9.5vw, 5.4vh), 3rem);
        }
        .sub {
          font-size: clamp(1.1rem, min(5vw, 3.4vh), 1.5rem);
        }
        .pad {
          width: min(380px, 100%);
        }
        .key {
          height: clamp(42px, 7.2vh, 66px);
          font-size: clamp(1.4rem, 4.2vh, 2rem);
        }
        .key.fn {
          font-size: clamp(1rem, 2.8vh, 1.3rem);
        }
        .frame {
          width: clamp(72px, min(36vw, 16.5vh), 170px);
        }
        .hint {
          font-size: clamp(0.95rem, 2.3vh, 1.1rem);
        }
      }
      @media (max-width: 820px) and (max-height: 680px) {
        .hint {
          display: none;
        }
        .key {
          height: clamp(38px, 6.8vh, 60px);
        }
      }
      /* ---------- left side: bigger again ---------- */
      .stage {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .view {
        max-width: 580px;
      }
      #open {
        max-width: 640px;
      }
      .crest {
        width: clamp(38px, 8vh, 64px);
        height: clamp(38px, 8vh, 64px);
      }
      h1 {
        font-size: clamp(2.2rem, min(6.6vw, 8.6vh), 4.5rem);
      }
      .sub {
        font-size: clamp(1.25rem, min(5vw, 4.2vh), 2rem);
      }
      .dots {
        gap: clamp(14px, 3.6vh, 28px);
        height: clamp(18px, 3.4vh, 30px);
      }
      .dot {
        width: clamp(18px, 3.4vh, 30px);
        height: clamp(18px, 3.4vh, 30px);
      }
      .pad {
        width: min(500px, 100%);
        gap: clamp(9px, 2vh, 18px);

      @media (max-width: 820px) {

          font-size: clamp(1.9rem, min(10vw, 5.8vh), 3.2rem);

          display: none;

        }

      /* ---------- page 4: candles ---------- */
      .stage {
        grid-template-columns: 1fr !important;
        place-items: center;
        align-content: center;
        z-index: auto !important;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 760px;
        height: 100%;
        justify-content: center;
      }
      .wrap h1,
      .wrap .sub,
      .ctrl {
        position: relative;
        z-index: 4;
      }
      .wrap h1 {
        font-size: clamp(2rem, min(7.5vw, 8.5vh), 4.4rem);
        margin: 0 0 0.6vh;
        animation:
          in 0.9s both,
          shine 5s linear infinite;
      }
      .wrap .sub {
        font-size: clamp(1.1rem, min(4.6vw, 3.6vh), 1.8rem);
        margin: 0 0 clamp(2px, 1vh, 10px);
        min-height: 2.6em;
        max-width: 92%;
        animation: in 0.9s 0.15s both;
      }
      .cakebox {
        position: relative;
        z-index: 1;
        height: clamp(190px, 46vh, 540px);
        aspect-ratio: 300/320;
        max-width: 92vw;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: in 1.2s 0.3s both;
      }
      .cakebox svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
      }
      .cakebox:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 6px;
        border-radius: 16px;
      }
      .lean {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        transition: opacity 0.35s;
      }
      .flick {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: flick 0.9s ease-in-out infinite;
      }
      @keyframes flick {
        0%,
        100% {
          transform: scale(1, 1) skewX(0);
        }
        20% {
          transform: scale(0.94, 1.1) skewX(3deg);
        }
        40% {
          transform: scale(1.05, 0.93) skewX(-3deg);
        }
        60% {
          transform: scale(0.96, 1.12) skewX(2deg);
        }
        80% {
          transform: scale(1.04, 0.96) skewX(-2deg);
        }
      }
      .cglow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: gl 1.6s ease-in-out infinite;
        transition: opacity 0.4s;
      }
      @keyframes gl {
        50% {
          opacity: 0.65;
          transform: scale(1.18);
        }
      }
      .candle.out .lean,
      .candle.out .cglow {
        opacity: 0;
      }
      .candle.out .ember {
        opacity: 1;
      }
      .ember {
        opacity: 0;
        transition: opacity 0.3s;
      }
      @keyframes ember {
        50% {
          opacity: 0.4;
        }
      }
      .candle.out .ember {
        animation: ember 1.2s ease-in-out 3;
      }
      .smoke {
        position: fixed;
        z-index: 3;
        width: 10px;
        height: 70px;
        margin-left: -5px;
        margin-top: -60px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 80%,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0) 70%
        );
        filter: blur(3px);
        opacity: 0;
        animation: smoke 2.6s ease-out forwards;
      }
      @keyframes smoke {
        0% {
          opacity: 0;
          transform: translate(0, 10px) scale(0.5, 0.5);
        }
        15% {
          opacity: 0.8;
        }
        60% {
          transform: translate(14px, -60px) scale(1.4, 1.6) rotate(14deg);
        }
        100% {
          opacity: 0;
          transform: translate(-10px, -130px) scale(2.2, 2.4) rotate(-12deg);
        }
      }
      #dark {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        transition: opacity 1.6s ease;
        background: radial-gradient(
          circle at var(--cx, 50%) var(--cy, 45%),
          rgba(0, 0, 0, 0) var(--r1, 120px),
          rgba(6, 0, 2, 0.8) var(--r2, 420px)

      #dark.off {
        opacity: 0;
      }
      .ctrl {
        display: flex;
        flex-direction: column;

        min-height: clamp(70px, 14vh, 120px);

      .ctrl .hint {
        margin: clamp(6px, 1.4vh, 14px) 0 0;
      }
      .ctrl button.main,
      .ctrl a.main {
        margin-top: 0;
      }
      .ctrl a.main {
        display: none;
      }
      body.lit .ctrl a.main {
        display: inline-block;
        animation:
          in 0.9s both,
          sheen 4s 1.6s ease-in-out infinite,
          pulse 2.2s 1.6s ease-out infinite;
      }
      body.lit #blow,
      body.lit .ctrl .hint {
        display: none;
      }
      #blow {
        animation: blowpulse 2.4s ease-in-out infinite;
      }
      @keyframes blowpulse {
        50% {
          box-shadow: 0 0 0 14px rgba(240, 217, 154, 0);
        }
        0% {
          box-shadow: 0 0 0 0 rgba(240, 217, 154, 0.5);
        }
      }
      @media (max-width: 820px) {
        .wrap h1 {
          font-size: clamp(1.9rem, min(10vw, 6vh), 3.2rem);
        }
      }
      @media (max-height: 600px) {
        .hint {
          display: none;
        }
      }
    </style>

  <body>
    <div id="spot" aria-hidden="true"></div>
    <canvas id="sparks" aria-hidden="true"></canvas>
    <div id="dark" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="stage">
      <section class="wrap">
        <h1 id="title">Make a Wish</h1>
        <p class="sub" id="tw">&nbsp;</p>
        <div
          class="cakebox"
          id="cake"
          role="button"
          tabindex="0"
          aria-label="Birthday cake. Tap to blow out the candles"
        ></div>
        <div class="ctrl">
          <button class="main" id="blow" type="button">Blow the candles</button>
          <a class="main" id="next" href="#">Open the next page</a>
          <p class="hint" id="hint">
            Use your microphone and really blow,<br />or just tap the cake
          </p>
          <p class="hint" id="soon" hidden>
            The next page isn&rsquo;t ready yet.
          </p>
        </div>
      </section>
    </main>

    <script>
      // ---- Change these ----
      var NEXT_PAGE = "Happy_Birthday_Page_3.1.html"; // link to the next page (page 5) goes here
      var NAME = "Bhuvan";
      var CANDLES = 7; // how many candles on the cake
      // ----------------------
      var $ = function (id) {
        return document.getElementById(id);
      };

      // ---------- build the cake ----------
      function cakeSVG() {
        var s =
          '<svg viewBox="0 0 300 320" aria-hidden="true"><defs>' +
          '<linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a42438"/><stop offset="1" stop-color="#5e0f1d"/></linearGradient>' +
          '<linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8304a"/><stop offset="1" stop-color="#701225"/></linearGradient>' +
          '<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d99a"/><stop offset=".55" stop-color="#d8b45c"/><stop offset="1" stop-color="#a77b35"/></linearGradient>' +
          '<linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset=".6" stop-color="#ffb938"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>' +
          '<radialGradient id="gw" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".85"/><stop offset=".5" stop-color="#ff9a3c" stop-opacity=".28"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>' +
          "</defs>";
        s +=
          '<ellipse cx="150" cy="288" rx="138" ry="16" fill="url(#gd)"/><ellipse cx="150" cy="284" rx="126" ry="11" fill="#7a1626"/>';
        // bottom tier
        s +=
          '<rect x="40" y="200" width="220" height="84" rx="10" fill="url(#t1)" stroke="#f0d99a" stroke-width="1.2"/>';
        s += '<rect x="40" y="262" width="220" height="8" fill="url(#gd)"/>';
        for (var k = 0; k < 12; k++)
          s +=
            '<circle cx="' +
            (52 + k * 18) +
            '" cy="266" r="2.6" fill="#fff6dc"/>';
        s +=
          '<path d="M150 254C128 240 132 224 143 226C147 227 150 230 150 230C150 230 153 227 157 226C168 224 172 240 150 254Z" fill="url(#gd)"/>';
        [
          [62, 232],
          [84, 246],
          [218, 236],
          [238, 248],
          [104, 226],
          [196, 250],
        ].forEach(function (p, i) {
          s +=
            '<circle cx="' +
            p[0] +
            '" cy="' +
            p[1] +
            '" r="2.4" fill="' +
            (i % 2 ? "#ff8fa3" : "#f0d99a") +
            '"/>';
        });
        s +=
          '<rect x="40" y="200" width="220" height="18" rx="9" fill="#f6f1e7"/>';
        [58, 92, 126, 174, 208, 242].forEach(function (x, i) {
          var h = 12 + (i % 3) * 6;
          s +=
            '<path d="M' +
            (x - 5) +
            " 210v" +
            h +
            "a5 5 0 0 0 10 0v-" +
            h +
            'z" fill="#f6f1e7"/>';
        });
        // top tier
        s +=
          '<rect x="80" y="142" width="140" height="62" rx="10" fill="url(#t2)" stroke="#f0d99a" stroke-width="1.2"/>';
        s += '<rect x="80" y="182" width="140" height="7" fill="url(#gd)"/>';
        [
          [100, 166],
          [124, 172],
          [176, 168],
          [200, 174],
        ].forEach(function (p, i) {
          s +=
            '<circle cx="' +
            p[0] +
            '" cy="' +
            p[1] +
            '" r="2.2" fill="' +
            (i % 2 ? "#f0d99a" : "#ff8fa3") +
            '"/>';
        });
        s +=
          '<rect x="80" y="142" width="140" height="16" rx="8" fill="#f6f1e7"/>';
        [96, 124, 150, 176, 204].forEach(function (x, i) {
          var h = 8 + (i % 2) * 6;
          s +=
            '<path d="M' +
            (x - 4.5) +
            " 150v" +
            h +
            "a4.5 4.5 0 0 0 9 0v-" +
            h +
            'z" fill="#f6f1e7"/>';
        });
        // candles
        var cols = ["#f6f1e7", "#f0d99a", "#ff8fa3"],
          span = 108,
          step = CANDLES > 1 ? span / (CANDLES - 1) : 0;
        for (var i = 0; i < CANDLES; i++) {
          var x = 150 - span / 2 + i * step,
            c = cols[i % 3];
          s +=
            '<g class="candle" data-i="' +
            i +
            '">' +
            '<circle class="cglow" cx="' +
            x +
            '" cy="90" r="26" fill="url(#gw)" style="animation-delay:' +
            i * 0.17 +
            's"/>' +
            '<rect x="' +
            (x - 4) +
            '" y="108" width="8" height="38" rx="2" fill="' +
            c +
            '"/>' +
            '<path d="M' +
            (x - 4) +
            " 116l8 -4M" +
            (x - 4) +
            " 126l8 -4M" +
            (x - 4) +
            ' 136l8 -4" stroke="rgba(120,20,40,.35)" stroke-width="2"/>' +
            '<line x1="' +
            x +
            '" y1="108" x2="' +
            x +
            '" y2="104" stroke="#2b0a10" stroke-width="1.4"/>' +
            '<circle class="ember" cx="' +
            x +
            '" cy="104" r="1.8" fill="#ff7a1a"/>' +
            '<g transform="translate(' +
            x +
            ' 104)"><g class="lean"><g class="flick" style="animation-delay:' +
            i * 0.13 +
            's">' +
            '<path d="M0 0C-7 -7 -6 -17 0 -28C6 -17 7 -7 0 0Z" fill="url(#fl)"/>' +
            '<path d="M0 -1C-3 -5 -3 -10 0 -16C3 -10 3 -5 0 -1Z" fill="#fffbe0"/>' +
            "</g></g></g></g>";
        }
        return s + "</svg>";
      }
      var cake = $("cake");
      cake.innerHTML = cakeSVG();
      var candleEls = [].slice.call(cake.querySelectorAll(".candle")),
        leans = [].slice.call(cake.querySelectorAll(".lean"));

      // ---------- typewriter ----------
      var twTimer;
      function tw(text) {
        var el = $("tw");
        clearTimeout(twTimer);
        el.classList.remove("done");
        el.textContent = "";
        var i = 0;
        twTimer = setTimeout(function t() {
          el.textContent = text.slice(0, ++i);
          if (i < text.length) twTimer = setTimeout(t, 45);
          else el.classList.add("done");
        }, 300);
      }
      tw("Close your eyes\u2026 think of something beautiful.");

      // ---------- darkness around the candle light ----------
      var dark = $("dark"),
        cxp = innerWidth / 2,
        cyp = innerHeight * 0.45;
      function place() {
        var r = cake.getBoundingClientRect();
        cxp = r.left + r.width / 2;
        cyp = r.top + r.height * 0.3;
        dark.style.setProperty("--cx", cxp + "px");
        dark.style.setProperty("--cy", cyp + "px");
      }
      addEventListener("resize", place);
      place();
      setTimeout(place, 1500);

      // ---------- state ----------
      var out = false,
        listening = false,
        lean = 0;
      function smoke(i) {
        var f = candleEls[i].querySelector(".lean").getBoundingClientRect(),
          el = document.createElement("div");
        el.className = "smoke";
        el.style.left = f.left + f.width / 2 + "px";
        el.style.top = f.top + f.height * 0.5 + "px";
        document.body.appendChild(el);
        setTimeout(function () {
          el.remove();
        }, 2700);
      }
      function blowOut() {
        if (out) return;
        out = true;
        stopMic();
        $("blow").disabled = true;
        leans.forEach(function (l) {
          l.style.transition = "transform .25s";
          l.style.transform = "rotate(38deg) scale(.7)";
        });
        candleEls.forEach(function (c, i) {
          setTimeout(
            function () {
              c.classList.add("out");
              smoke(i);
            },
            120 + i * 150,
          );
        });
        setTimeout(celebrate, 120 + CANDLES * 150 + 900);
      }
      function celebrate() {
        if (window.BDMusic) BDMusic.duck(false);
        dark.classList.add("off");
        document.body.classList.add("lit");
        var h = $("title");
        h.textContent = "Happy Birthday, " + NAME + "!";
        h.style.animation = "none";
        void h.offsetWidth;
        h.style.animation = "";
        tw("May every wish you just made come true \u2764");
        var r = cake.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height * 0.3, 140);
        for (var i = 0; i < 7; i++)
          (function (i) {
            setTimeout(
              function () {
                firework(
                  innerWidth * (0.12 + Math.random() * 0.76),
                  innerHeight * (0.12 + Math.random() * 0.4),
                );
              },
              200 + i * 520,
            );
          })(i);
        setTimeout(function () {
          burst(innerWidth * 0.2, innerHeight * 0.5, 70);
          burst(innerWidth * 0.8, innerHeight * 0.5, 70);
        }, 1200);
        setInterval(function () {
          if (document.hidden) return;
          var b = cake.getBoundingClientRect();
          var el = document.createElement("div");
          el.className = "fh";
          el.textContent = "\u2665";
          el.style.left = b.left + Math.random() * b.width + "px";
          el.style.top = b.top + b.height * 0.6 + "px";
          el.style.setProperty("--dx", (Math.random() - 0.5) * 120 + "px");
          el.style.fontSize = 12 + Math.random() * 16 + "px";
          document.body.appendChild(el);
          setTimeout(function () {
            el.remove();
          }, 3300);
        }, 700);
      }
      cake.addEventListener("click", blowOut);
      cake.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          blowOut();
        }
      });

      // ---------- microphone blow detection ----------
      var ac,
        stream,
        an,
        buf,
        raf,
        base = 0,
        baseN = 0,
        blowT = 0,
        lastT = 0,
        t0 = 0;
      function stopMic() {
        listening = false;
        cancelAnimationFrame(raf);
        try {
          if (stream)
            stream.getTracks().forEach(function (t) {
              t.stop();
            });
          if (ac) ac.close();
        } catch (e) {}
      }
      function startMic() {
        var md = navigator.mediaDevices;
        if (!md || !md.getUserMedia) {
          micFail();
          return;
        }
        md.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          },
        })
          .then(function (s) {
            stream = s;
            ac = new (window.AudioContext || window.webkitAudioContext)();
            var src = ac.createMediaStreamSource(s);
            an = ac.createAnalyser();
            an.fftSize = 1024;
            src.connect(an);
            buf = new Uint8Array(an.fftSize);
            listening = true;
            if (window.BDMusic) BDMusic.duck(true);
            t0 = lastT = performance.now();
            base = 0;
            baseN = 0;
            blowT = 0;
            $("blow").textContent = "Listening\u2026 blow now!";
            tw("Take a deep breath\u2026 and blow!");
            $("hint").innerHTML = "You can also just tap the cake";
            (function loop(now) {
              if (!listening) return;
              raf = requestAnimationFrame(loop);
              an.getByteTimeDomainData(buf);
              var sum = 0;
              for (var i = 0; i < buf.length; i++) {
                var v = (buf[i] - 128) / 128;
                sum += v * v;
              }
              var rms = Math.sqrt(sum / buf.length),
                dt = now - lastT;
              lastT = now;
              if (now - t0 < 600) {
                base = (base * baseN + rms) / (baseN + 1);
                baseN++;
                return;
              }
              var lvl = Math.max(0, rms - base - 0.01);
              var target = Math.min(26, lvl * 320);
              lean += (target - lean) * 0.25;
              leans.forEach(function (l, i) {
                l.style.transition = "none";
                l.style.transform =
                  "rotate(" +
                  lean * (1 + ((i % 3) - 1) * 0.15) +
                  "deg) scale(" +
                  (1 - lean / 90) +
                  ")";
              });
              if (lvl > 0.045) blowT += dt;
              else blowT = Math.max(0, blowT - dt * 1.5);
              if (blowT > 420) blowOut();
            })(performance.now());
          })
          .catch(micFail);
      }
      function micFail() {
        if (window.BDMusic) BDMusic.duck(false);
        tw(
          "The microphone isn\u2019t available, so just tap the cake to blow out the candles!",
        );
        $("blow").style.display = "none";
        $("hint").style.display = "none";
      }
      $("blow").addEventListener("click", function () {
        if (!listening && !out) startMic();
      });

      // next page button
      var nx = $("next");
      if (NEXT_PAGE) nx.href = NEXT_PAGE;
      nx.addEventListener("click", function (e) {
        if (!NEXT_PAGE) {
          e.preventDefault();
          $("soon").hidden = false;
        } else {
          e.preventDefault();
          location.href = NEXT_PAGE;
        }
      });

      // ---------- sparkles, confetti, fireworks ----------
      var cv = $("sparks"),
        cx = cv.getContext("2d"),
        W,
        H,
        P = [];
      function size() {
        W = cv.width = innerWidth;
        H = cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      function spark(y) {
        return {
          x: Math.random() * W,
          y: y === undefined ? H + 20 : y,
          r: 1.5 + Math.random() * 5,
          v: 0.25 + Math.random() * 0.7,
          sw: Math.random() * 6.28,
          sp: 0.01 + Math.random() * 0.02,
          a: 0.15 + Math.random() * 0.5,
          t: Math.random() * 6.28,
          k: 0,
        };
      }
      for (var i = 0; i < 40; i++) P.push(spark(Math.random() * H));
      var COL = [
        "#f0d99a",
        "#ff8fa3",
        "#ffffff",
        "#d8b45c",
        "#c24a5a",
        "#ffb938",
      ];
      function draw(now) {
        cx.clearRect(0, 0, W, H);
        // flickering ring of light around the candles
        var t = (now || 0) / 1000,
          base2 = Math.min(innerWidth, innerHeight) * (out ? 0.9 : 0.62),
          fl = 1 + 0.04 * Math.sin(t * 7) + 0.025 * Math.sin(t * 13.3);
        dark.style.setProperty("--r1", base2 * 0.32 * fl + "px");
        dark.style.setProperty("--r2", base2 * fl + "px");
        for (var i = P.length - 1; i >= 0; i--) {
          var p = P[i];
          if (p.k === 1) {
            // confetti
            p.vy += 0.08;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.rv;
            if (p.y > H + 20) {
              P.splice(i, 1);
              continue;
            }
            cx.save();
            cx.translate(p.x, p.y);
            cx.rotate(p.rot);
            cx.fillStyle = p.c;
            cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            cx.restore();
          } else if (p.k === 2) {
            // firework
            p.vx *= 0.985;
            p.vy = p.vy * 0.985 + 0.045;
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.011;
            if (p.life <= 0) {
              P.splice(i, 1);
              continue;
            }
            cx.globalAlpha = Math.max(0, p.life);
            cx.fillStyle = p.c;
            cx.beginPath();
            cx.arc(p.x, p.y, 2.2, 0, 6.28);
            cx.fill();
            cx.globalAlpha = 1;
          } else {
            p.y -= p.v;
            p.sw += p.sp;
            p.x += Math.sin(p.sw) * 0.4;
            p.t += 0.03;
            if (p.y < -20) {
              P[i] = spark();
              continue;
            }
            var al = p.a * (0.6 + 0.4 * Math.sin(p.t)),
              g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
            g.addColorStop(0, "rgba(255,225,160," + al + ")");
            g.addColorStop(1, "rgba(255,225,160,0)");
            cx.fillStyle = g;
            cx.beginPath();
            cx.arc(p.x, p.y, p.r * 3, 0, 6.28);
            cx.fill();
          }
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
      function burst(x, y, n) {
        for (var i = 0; i < n; i++)
          P.push({
            k: 1,
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 12,
            vy: -4 - Math.random() * 9,
            rot: Math.random() * 6,
            rv: (Math.random() - 0.5) * 0.4,
            w: 6 + Math.random() * 7,
            h: 9 + Math.random() * 9,
            c: COL[Math.floor(Math.random() * COL.length)],
          });
      }
      function firework(x, y) {
        var c1 = COL[Math.floor(Math.random() * COL.length)],
          c2 = COL[Math.floor(Math.random() * COL.length)];
        for (var i = 0; i < 70; i++) {
          var a = Math.random() * 6.28,
            v = 1.5 + Math.random() * 4.2;
          P.push({
            k: 2,
            x: x,
            y: y,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            life: 1,
            c: i % 2 ? c1 : c2,
          });
        }
      }

      // spotlight follows finger/mouse
      addEventListener("pointermove", function (e) {
        document.documentElement.style.setProperty("--mx", e.clientX + "px");
        document.documentElement.style.setProperty("--my", e.clientY + "px");
      });
    </script>
    <script src="music.js"></script>
  </body>
