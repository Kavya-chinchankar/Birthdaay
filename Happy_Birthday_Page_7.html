
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Three Gifts</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="gifts.css">

<style>
.cards{
  display:flex;
  gap:clamp(10px,3vw,24px);
  justify-content:center;
  margin:clamp(4px,2vh,16px) 0 clamp(14px,3.5vh,30px);
}

.card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:clamp(92px,27vw,170px);
  padding:clamp(12px,2.4vh,22px) 8px clamp(10px,2vh,18px);
  border-radius:24px;
  text-decoration:none;
  color:var(--ivory);
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:1.5px solid rgba(240,217,154,.45);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 16px 36px rgba(0,0,0,.35);
  animation:in .9s both,float 3.6s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
  transition:transform .35s cubic-bezier(.2,1.4,.4,1),border-color .3s,box-shadow .3s;
}

.card:nth-child(1){animation-delay:.6s,1.5s}
.card:nth-child(2){animation-delay:.8s,2s}
.card:nth-child(3){animation-delay:1s,2.5s}

@keyframes float{
  50%{transform:translateY(-10px)}
}

.card:hover,.card:active{
  border-color:var(--gold-soft);
  box-shadow:0 20px 44px rgba(0,0,0,.45),0 0 34px rgba(240,217,154,.35);
}

.card svg{
  width:clamp(56px,min(18vw,15vh),110px);
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));
}

.card span{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.05rem,3.6vw,1.45rem);
  font-weight:600;
  color:var(--gold-soft);
}

.badge{
  position:absolute;
  top:-8px;
  right:-8px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-soft));
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  display:none;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.card.done .badge{
  display:flex;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1);
}

@keyframes pop{
  from{transform:scale(0)}
}

.tw{
  animation:tw 1.8s ease-in-out infinite;
  transform-box:fill-box;
  transform-origin:center;
}

@keyframes tw{
  0%,100%{opacity:.3;transform:scale(.6)}
  50%{opacity:1;transform:scale(1.15)}
}
</style>
</head>

<body>

<div id="spot" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="wrap">

  <div class="eyebrow">made just for you</div>

  <h1>Three little gifts</h1>

  <div class="msg show" style="animation-delay:.5s">
    Tap each one to open it
  </div>

  <div class="cards">

    <!-- FLOWER -->
    <a class="card"
       href="Happy_Birthday_Page_7_Flower.html"
       data-nav
       data-k="flower"
       aria-label="Open the flower">

      <span class="badge">✓</span>

      <svg viewBox="0 0 100 120">

        <path d="M50 118 C50 96 48 84 50 66"
              stroke="#4f9a5a"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"/>

        <path d="M49 100 C32 98 24 88 22 78 C36 78 46 86 49 100z"
              fill="#5fb36a"/>

        <path d="M51 92 C66 90 74 82 77 72 C64 72 54 80 51 92z"
              fill="#4f9a5a"/>

        <g transform="translate(50 46)">

          <g fill="#ec6b8a">
            <ellipse cy="-20" rx="10" ry="19"/>
            <ellipse cy="-20" rx="10" ry="19" transform="rotate(60)"/>
            <ellipse cy="-20" rx="10" ry="19" transform="rotate(120)"/>
            <ellipse cy="-20" rx="10" ry="19" transform="rotate(180)"/>
            <ellipse cy="-20" rx="10" ry="19" transform="rotate(240)"/>
            <ellipse cy="-20" rx="10" ry="19" transform="rotate(300)"/>
          </g>

          <g fill="#f7a1b7">
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(30)"/>
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(90)"/>
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(150)"/>
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(210)"/>
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(270)"/>
            <ellipse cy="-12" rx="7" ry="12" transform="rotate(330)"/>
          </g>

          <circle r="8" fill="#f0d99a"/>

        </g>
      </svg>

      <span>A Flower</span>
    </a>


    <!-- GIFT BOX -->
    <a class="card"
       href="Happy_Birthday_Page_7_Box.html"
       data-nav
       data-k="box"
       aria-label="Open the gift box">

      <span class="badge">✓</span>

      <svg viewBox="0 0 100 100">

        <defs>
          <linearGradient id="b7" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c13a4d"/>
            <stop offset="1" stop-color="#7a1626"/>
          </linearGradient>
        </defs>

        <rect x="16" y="47" width="68" height="44"
              rx="5" fill="url(#b7)"/>

        <rect x="45" y="47" width="10" height="44"
              fill="#f0d99a"/>

        <rect x="11" y="34" width="78" height="16"
              rx="5" fill="#d1566a"/>

        <rect x="45" y="34" width="10" height="16"
              fill="#f0d99a"/>

        <path d="M50 34 C34 14 18 22 30 32 C36 36 46 35 50 34z"
              fill="#f0d99a"/>

        <path d="M50 34 C66 14 82 22 70 32 C64 36 54 35 50 34z"
              fill="#d8b45c"/>

        <circle cx="50" cy="33" r="5" fill="#f6e3a8"/>

        <path class="tw"
              d="M88 18 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z"
              fill="#fff3d6"/>

      </svg>

      <span>A Gift</span>
    </a>


    <!-- LETTER -->
    <a class="card"
       href="Happy_Birthday_Page_7_Letter.html"
       data-nav
       data-k="letter"
       aria-label="Open the letter">

      <span class="badge">✓</span>

      <svg viewBox="0 0 100 80">

        <rect x="6" y="12" width="88" height="60"
              rx="7" fill="#f3e6cf"/>

        <path d="M6 19 L50 50 L94 19"
              stroke="#c9a96a"
              stroke-width="2.5"
              fill="none"
              stroke-linejoin="round"/>

        <path d="M6 70 L38 42 M94 70 L62 42"
              stroke="#d9c299"
              stroke-width="2"
              fill="none"/>

        <path d="M50 64 C38 56 36 48 42 45 C46 43 50 46 50 49 C50 46 54 43 58 45 C64 48 62 56 50 64z"
              fill="#c1273f"
              transform="translate(0 -8)"/>

      </svg>

      <span>A Letter</span>
    </a>

  </div>


  <!-- NEXT PAGE BUTTON -->
  <div class="btns show"
       style="animation:in .9s 1.3s both;opacity:1">

    <a class="btn gold"
       href="Happy_Birthday_Page_7.5.html"
       data-nav>
       Next page →
    </a>

  </div>

</div>


<!-- IMPORTANT: LOAD SHARED JAVASCRIPT FIRST -->
<script src="gifts.js"></script>
<script src="music.js"></script>


<!-- CHECK OPENED GIFTS -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  if (window.G && typeof window.G.seen === "function") {

    var s = window.G.seen();

    document.querySelectorAll(".card").forEach(function(c) {

      if (s[c.dataset.k]) {
        c.classList.add("done");
      }

    });

  } else {
    console.error("gifts.js did not load correctly. Check its file path.");
  }

});
</script>

</body>
</html>
