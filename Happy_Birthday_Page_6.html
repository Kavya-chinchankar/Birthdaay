<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Gift For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f1e7;--ivory-dim:#e3cfc6;--ink:#2b0a10;--gold:#d8b45c;--gold-soft:#f0d99a;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:#3a0711}
html,body{margin:0;height:100%;overflow:hidden}
/* ---- background: same as page 1 ---- */
body{font-family:'Lora',Georgia,serif;color:var(--ivory);height:100dvh;text-align:center;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:linear-gradient(135deg,#3a0711,#6a1020,#4a0a16,#7a1626,#3a0711);background-size:400% 400%;background-attachment:fixed;animation:bg 22s ease-in-out infinite}
.wrap{transition:opacity .8s}
body.leave .wrap{opacity:0}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
body::before{width:380px;height:380px;background:rgba(216,180,92,.20);top:-110px;left:-90px;animation:orb1 14s ease-in-out infinite}
body::after{width:440px;height:440px;background:rgba(200,50,70,.28);bottom:-150px;right:-110px;animation:orb2 17s ease-in-out infinite}
@keyframes orb1{50%{transform:translate(90px,70px)}}
@keyframes orb2{50%{transform:translate(-90px,-60px)}}
#spot{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,45%),rgba(255,190,120,.20),transparent 60%)}
#sparks,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sparks{z-index:0}#fx{z-index:5}
.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* ---- layout ---- */
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,3.4vh,1.6rem);color:var(--gold-soft);animation:in .9s .1s cubic-bezier(.2,.7,.2,1) both}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(2.1rem,min(9vw,7.4vh),3.9rem);line-height:1.1;margin:.15em 0 clamp(16px,4vh,38px);
  background:linear-gradient(100deg,var(--ivory) 30%,var(--gold-soft) 50%,var(--ivory) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:in .9s .3s both,shine 5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
h1.swap{animation:swap .5s both,shine 5s linear infinite}
@keyframes swap{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.stage{position:relative;width:min(64vw,34vh,280px);aspect-ratio:1;margin:clamp(6px,2vh,18px) 0;display:flex;align-items:center;justify-content:center;animation:in 1s .5s both}
.stage::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(240,217,154,.4),transparent 68%);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.2);opacity:.7}}
.ring{position:absolute;inset:-4%;border-radius:50%;border:1.5px dashed rgba(240,217,154,.45);animation:spin 18s linear infinite}
.ring.r2{inset:-16%;border-style:dotted;animation-duration:28s;animation-direction:reverse;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{position:absolute;inset:-60%;opacity:0;pointer-events:none;background:repeating-conic-gradient(rgba(240,217,154,.35) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%)}
.rays.on{animation:rays 2.2s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(70deg)}}

#gift{position:relative;width:78%;height:78%;cursor:pointer;animation:bounce 2.2s ease-in-out infinite;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5))}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-14px) rotate(3deg)}50%{transform:translateY(0) rotate(-3deg)}}
#gift svg{width:100%;height:100%;overflow:visible}
#lid{transform-box:fill-box;transform-origin:50% 100%}
#gift.shy{animation:nope .5s}
@keyframes nope{20%,60%{transform:translateX(-10px) rotate(-6deg)}40%,80%{transform:translateX(10px) rotate(6deg)}}
#gift.open{animation:pop 1.1s forwards}
#gift.open #lid{animation:lid 1s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes pop{30%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1.15) rotate(0)}}
@keyframes lid{0%{transform:none}40%{transform:translateY(-40px) rotate(-18deg)}100%{transform:translate(30px,-120px) rotate(35deg);opacity:0}}
.twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle:nth-of-type(2){animation-delay:.6s}.twinkle:nth-of-type(3){animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}

#pet{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#pet.on{display:flex;animation:drop .65s cubic-bezier(.2,1.5,.4,1)}
#pet svg{width:100%;height:100%;overflow:visible;animation:sob .45s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-70px) scale(.4) rotate(-12deg);opacity:0}}
@keyframes sob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(5px) rotate(1.5deg)}}
.tear{animation:tear 1.1s ease-in infinite;transform-box:fill-box}
.tear.b{animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(60px);opacity:0}}
.stream{animation:str .5s ease-in-out infinite alternate;transform-origin:50% 0;transform-box:fill-box}
@keyframes str{to{transform:scaleY(1.25)}}

#msg{min-height:2.7em;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.25rem,min(5vw,3.8vh),1.9rem);color:#ecdccf;margin:4px 0 clamp(8px,2vh,16px);max-width:520px;line-height:1.35;display:flex;align-items:center;justify-content:center;animation:in .9s .7s both}
#msg.pop{animation:msgin .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes msgin{from{opacity:0;transform:translateY(12px) scale(.92)}}

.btns{display:flex;gap:16px;align-items:center;justify-content:center;min-height:clamp(70px,12vh,96px);animation:in .9s .9s both}
button{font-family:'Lora',serif;font-weight:600;border:0;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .3s}
#yes{transition:transform .5s cubic-bezier(.2,1.4,.4,1);font-size:1.15rem;padding:16px 38px;color:var(--ink);background:linear-gradient(100deg,var(--gold) 0%,var(--gold-soft) 45%,var(--gold) 90%);background-size:220% 100%;box-shadow:0 12px 30px rgba(0,0,0,.45);transform:scale(var(--ys,1));animation:sheen 4s ease-in-out infinite,pulse 2.2s ease-out infinite}
@keyframes sheen{50%{background-position:100% 0}}
@keyframes pulse{0%{box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 0 rgba(240,217,154,.7)}100%{box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 22px rgba(240,217,154,0)}}
#no{font-size:1.05rem;padding:14px 30px;color:var(--ivory);background:rgba(255,255,255,.07);border:1.5px solid rgba(240,217,154,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:scale(var(--ns,1))}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#no{max-width:220px;white-space:nowrap;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .35s,max-width .5s ease,padding .5s ease,margin .5s ease,border-width .5s ease}
.hide{opacity:0;pointer-events:none;transform:scale(0)!important;max-width:0!important;padding-left:0!important;padding-right:0!important;margin-left:-16px!important;border-width:0!important;overflow:hidden}
.fh{position:fixed;z-index:6;pointer-events:none;color:#ff8fa3;animation:fh 2.6s ease-out forwards;text-shadow:0 0 8px rgba(255,120,140,.8)}
@keyframes fh{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
@media(max-height:600px){.eyebrow{display:none}}
@media(prefers-reduced-motion:reduce){*,body::before,body::after{animation-duration:.01s!important;animation-iteration-count:1!important}#sparks,#spot{display:none}}
</style>
</head>
<body>
<div id="spot" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas><canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <div class="eyebrow">there is one more thing</div>
  <h1 id="h">I have a gift for you</h1>
  <div class="stage" id="stage">
    <div class="rays" id="rays"></div><div class="ring"></div><div class="ring r2"></div>
    <div id="gift">
      <svg viewBox="0 0 200 200" aria-label="Gift box">
        <defs>
          <linearGradient id="bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b02f40"/><stop offset="1" stop-color="#7a1626"/></linearGradient>
          <linearGradient id="rb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8b45c"/><stop offset=".5" stop-color="#f6e3a8"/><stop offset="1" stop-color="#d8b45c"/></linearGradient>
        </defs>
        <rect x="32" y="94" width="136" height="88" rx="8" fill="url(#bx)"/>
        <rect x="90" y="94" width="20" height="88" fill="url(#rb)"/>
        <g id="lid">
          <rect x="22" y="68" width="156" height="32" rx="8" fill="#c9495a"/>
          <rect x="90" y="68" width="20" height="32" fill="url(#rb)"/>
          <path d="M100 68 C70 30 40 44 62 64 C72 72 92 70 100 68z" fill="#f0d99a"/>
          <path d="M100 68 C130 30 160 44 138 64 C128 72 108 70 100 68z" fill="#d8b45c"/>
          <circle cx="100" cy="66" r="9" fill="#f6e3a8"/>
        </g>
        <path class="twinkle" d="M30 50 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" fill="#f0d99a"/>
        <path class="twinkle" d="M170 40 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" fill="#fff3d6"/>
        <path class="twinkle" d="M176 120 l2 6 6 2 -6 2 -2 6 -2-6 -6-2 6-2z" fill="#f0d99a"/>
      </svg>
    </div>
    <div id="pet"></div>
  </div>
  <div id="msg">Will you accept it?</div>
  <div class="btns">
    <button id="yes">Yes💝</button>
    <button id="no">No</button>
  </div>
</div>

<script>
var NEXT_PAGE="Happy_Birthday_Page_7.html";
var $=function(i){return document.getElementById(i)};

/* ---- crying animals: refined, shaded vector style ---- */
var PETS=[
 {n:"cat",c:"#e8a76a",d:"#b9773f",m:"#fbe9d2",nose:"#e58f9c",
  back:'<path d="M34 96 L40 30 Q41 24 47 28 L92 62z" fill="D" stroke="D" stroke-width="6" stroke-linejoin="round"/><path d="M166 96 L160 30 Q159 24 153 28 L108 62z" fill="D" stroke="D" stroke-width="6" stroke-linejoin="round"/><path d="M47 80 L48 44 L78 64z" fill="#e9a3ad" opacity=".85"/><path d="M153 80 L152 44 L122 64z" fill="#e9a3ad" opacity=".85"/>',
  head:'<ellipse cx="100" cy="116" rx="68" ry="58" fill="url(#hg)"/>',
  extra:'<path d="M100 62 v16 M86 64 l4 13 M114 64 l-4 13" stroke="D" stroke-width="4" stroke-linecap="round" opacity=".55"/><g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".7"><path d="M72 142 L26 134 M72 148 L26 152 M128 142 L174 134 M128 148 L174 152"/></g>'},
 {n:"dog",c:"#d3a574",d:"#7d5430",m:"#f6e6cf",nose:"#2b1a1a",
  back:'<path d="M44 70 Q14 82 20 134 Q26 160 48 144 Q60 120 62 86z" fill="D"/><path d="M156 70 Q186 82 180 134 Q174 160 152 144 Q140 120 138 86z" fill="D"/>',
  head:'<ellipse cx="100" cy="112" rx="62" ry="60" fill="url(#hg)"/>',
  extra:'<path d="M100 56 Q84 82 100 100 Q116 82 100 56z" fill="#f6e6cf" opacity=".55"/>'},
 {n:"bunny",c:"#f1eded",d:"#cbbfc0",m:"#ffffff",nose:"#eaa0ae",
  back:'<ellipse cx="70" cy="40" rx="17" ry="48" fill="url(#hg)" transform="rotate(-9 70 40)"/><ellipse cx="130" cy="40" rx="17" ry="48" fill="url(#hg)" transform="rotate(9 130 40)"/><ellipse cx="70" cy="44" rx="8" ry="34" fill="#efb3bf" transform="rotate(-9 70 44)"/><ellipse cx="130" cy="44" rx="8" ry="34" fill="#efb3bf" transform="rotate(9 130 44)"/>',
  head:'<ellipse cx="100" cy="118" rx="64" ry="56" fill="url(#hg)"/>',
  extra:'<g stroke="#bdaeb0" stroke-width="1.6" stroke-linecap="round" opacity=".8"><path d="M76 144 L36 138 M76 150 L36 156 M124 144 L164 138 M124 150 L164 156"/></g>'},
 {n:"bear",c:"#b98355",d:"#7a4e2c",m:"#ecd3b2",nose:"#2b1a1a",
  back:'<circle cx="46" cy="62" r="24" fill="D"/><circle cx="154" cy="62" r="24" fill="D"/><circle cx="46" cy="62" r="12" fill="#e2b48e"/><circle cx="154" cy="62" r="12" fill="#e2b48e"/>',
  head:'<ellipse cx="100" cy="114" rx="66" ry="58" fill="url(#hg)"/>',extra:''}
];
function pet(p){
  var D=function(t){return t.replace(/"D"/g,'"'+p.d+'"')};
  return '<svg viewBox="0 0 200 200"><defs>'+
  '<radialGradient id="hg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="'+p.c+'"/><stop offset="1" stop-color="'+p.d+'"/></radialGradient>'+
  '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f6ff"/><stop offset="1" stop-color="#79c3f5"/></linearGradient></defs>'+
  '<ellipse cx="100" cy="186" rx="48" ry="6" fill="#000" opacity=".25"/>'+
  D(p.back)+p.head+D(p.extra)+
  '<ellipse cx="100" cy="142" rx="28" ry="21" fill="'+p.m+'"/>'+
  '<path d="M58 95 Q70 86 87 82 M142 95 Q130 86 113 82" stroke="'+p.d+'" stroke-width="4" fill="none" stroke-linecap="round"/>'+
  '<ellipse cx="71" cy="110" rx="11.5" ry="14" fill="#1b0e11"/><ellipse cx="129" cy="110" rx="11.5" ry="14" fill="#1b0e11"/>'+
  '<circle cx="67" cy="104" r="4.5" fill="#fff"/><circle cx="125" cy="104" r="4.5" fill="#fff"/><circle cx="76" cy="116" r="2.2" fill="#fff" opacity=".85"/><circle cx="134" cy="116" r="2.2" fill="#fff" opacity=".85"/>'+
  '<path d="M60 123 Q71 130 82 123 M118 123 Q129 130 140 123" stroke="#bfe6ff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>'+
  '<path class="stream" d="M64 128 Q60 142 63 156 M136 128 Q140 142 137 156" stroke="#bfe6ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>'+
  '<path class="tear" d="M66 128 q-8 12 0 17 q8 -5 0 -17z" fill="url(#tg)"/><path class="tear b" d="M134 128 q-8 12 0 17 q8 -5 0 -17z" fill="url(#tg)"/>'+
  '<path d="M91 132 Q100 128 109 132 Q109 140 100 143 Q91 140 91 132z" fill="'+p.nose+'"/><ellipse cx="97" cy="132" rx="3" ry="1.6" fill="#fff" opacity=".45"/>'+
  '<path d="M100 143 v5 M90 158 Q100 150 110 158" stroke="#3a2024" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>';
}

var MSGS=["Pleeease accept it? 🥺","Awww… he is crying now. Are you sure?","This gift was made with so much love…","Look at those tears 😭 try again?","Okay, now even the bunny is sobbing…","Just press Yes, my love 💔"];
var tries=0,petEl=$("pet"),msg=$("msg"),no=$("no"),yes=$("yes"),gift=$("gift"),done=false;

function say(t){msg.textContent=t;msg.classList.remove("pop");void msg.offsetWidth;msg.classList.add("pop")}
function title(t){var h=$("h");h.textContent=t;h.classList.remove("swap");void h.offsetWidth;h.classList.add("swap")}

no.addEventListener("click",function(){
  if(done)return;
  var p=PETS[tries%PETS.length];
  gift.style.display="none";
  petEl.classList.remove("on");void petEl.offsetWidth;
  petEl.innerHTML=pet(p);petEl.classList.add("on");
  say(MSGS[Math.min(tries,MSGS.length-1)]);
  tries++;
  title(tries<3?"Try again…":"Please try again 🥺");
  yes.style.setProperty("--ys",Math.min(1+tries*.16,1.9));
  no.style.setProperty("--ns",Math.max(1-tries*.13,.45));
  hearts(no,4,"💧");
  if(navigator.vibrate)navigator.vibrate(40);
});

yes.addEventListener("click",function(){
  if(done)return;done=true;
  yes.disabled=true;no.classList.add("hide");yes.style.setProperty("--ys",1.12);
  petEl.classList.remove("on");gift.style.display="";
  void gift.offsetWidth;gift.classList.add("open");
  $("rays").classList.add("on");
  title("Yay! 🎉");say("Opening your gift…");
  confetti();hearts(yes,22,"♥");
  if(navigator.vibrate)navigator.vibrate([60,40,90]);
  setTimeout(function(){document.body.classList.add("leave")},2600);
  setTimeout(function(){location.href=NEXT_PAGE},3300);
});

/* ---- floating hearts from an element ---- */
function hearts(from,n,ch){
  var r=from.getBoundingClientRect();
  for(var i=0;i<n;i++)(function(i){setTimeout(function(){
    var el=document.createElement("div");el.className="fh";el.textContent=ch;
    el.style.left=(r.left+Math.random()*r.width)+"px";el.style.top=(r.top+r.height/2)+"px";
    el.style.setProperty("--dx",((Math.random()-.5)*180)+"px");
    el.style.setProperty("--dy",(ch==="💧"?"-40px":-(80+Math.random()*220)+"px"));
    el.style.fontSize=(14+Math.random()*16)+"px";
    document.body.appendChild(el);setTimeout(function(){el.remove()},2700);
  },i*60)})(i);
}

/* ---- confetti ---- */
function confetti(){
  var c=$("fx"),x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight,ps=[],col=["#f0d99a","#d8b45c","#ff8fa3","#fff3d6","#c24a5a"];
  var s=$("stage").getBoundingClientRect(),ox=s.left+s.width/2,oy=s.top+s.height/2;
  for(var i=0;i<170;i++)ps.push({x:ox,y:oy,vx:(Math.random()-.5)*17,vy:-Math.random()*16-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[i%5]});
  (function t(){
    x.clearRect(0,0,W,H);var live=0;
    ps.forEach(function(p){p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<H+20)live++;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(live)requestAnimationFrame(t);else x.clearRect(0,0,W,H);
  })();
}

/* ---- sparkles (same as page 1) ---- */
(function(){
  var cv=$("sparks"),cx=cv.getContext("2d"),W,H,P=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener("resize",size);size();
  function spark(y){return{x:Math.random()*W,y:y===undefined?H+20:y,r:1.5+Math.random()*5,v:.25+Math.random()*.7,sw:Math.random()*6.28,sp:.01+Math.random()*.02,a:.15+Math.random()*.5,t:Math.random()*6.28}}
  for(var i=0;i<45;i++)P.push(spark(Math.random()*H));
  (function draw(){
    cx.clearRect(0,0,W,H);
    P.forEach(function(p,i){
      p.y-=p.v;p.sw+=p.sp;p.x+=Math.sin(p.sw)*.4;p.t+=.03;
      if(p.y<-20){P[i]=spark();return}
      var al=p.a*(.6+.4*Math.sin(p.t)),g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,"rgba(255,225,160,"+al+")");g.addColorStop(1,"rgba(255,225,160,0)");
      cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*3,0,6.28);cx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();

/* ---- spotlight follows finger/mouse, drifts when idle ---- */
(function(){
  var last=0,root=document.documentElement;
  function move(x,y){root.style.setProperty("--mx",x+"px");root.style.setProperty("--my",y+"px")}
  addEventListener("pointermove",function(e){last=Date.now();move(e.clientX,e.clientY)});
  setInterval(function(){if(Date.now()-last<2500)return;var t=Date.now()/1600;move(innerWidth*(.5+.25*Math.sin(t)),innerHeight*(.45+.12*Math.cos(t*.8)))},40);
})();

/* ---- tapping the gift itself: little shake + hearts ---- */
gift.addEventListener("click",function(){
  if(done)return;gift.classList.remove("shy");void gift.offsetWidth;gift.classList.add("shy");hearts(gift,6,"♥");
});
