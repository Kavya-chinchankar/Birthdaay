
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose Your Gift</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f6f1e7; --ivory-dim:#e3cfc6; --ink:#2b0a10; --gold:#d8b45c; --gold-soft:#f0d99a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:'Lora',Georgia,serif; color:var(--ivory); height:100dvh; padding:2vh 20px;
  background:linear-gradient(135deg,#3a0711,#6a1020,#4a0a16,#7a1626,#3a0711); background-size:400% 400%; background-attachment:fixed;
  animation:bg 22s ease-in-out infinite; position:relative; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
body::before{width:380px;height:380px;background:rgba(216,180,92,.20);top:-110px;left:-90px;animation:orb1 14s ease-in-out infinite}
body::after{width:440px;height:440px;background:rgba(200,50,70,.28);bottom:-150px;right:-110px;animation:orb2 17s ease-in-out infinite}
@keyframes orb1{50%{transform:translate(90px,70px)}}
@keyframes orb2{50%{transform:translate(-90px,-60px)}}
#spot{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px circle at var(--mx,70%) var(--my,40%),rgba(255,190,120,.20),transparent 60%)}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* Layout */
.stage{position:relative;z-index:1;height:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4vw}
.left{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:0}
.right{display:flex;align-items:center;justify-content:center;perspective:900px;min-height:0}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.view{display:none;width:100%;max-width:380px}
.view.active{display:flex;flex-direction:column;align-items:center}
.view.active>*{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.view.active>*:nth-child(2){animation-delay:.12s}
.view.active>*:nth-child(3){animation-delay:.24s}
.view.active>*:nth-child(4){animation-delay:.36s}
.view.active>*:nth-child(5){animation-delay:.48s}
.crest{width:clamp(30px,6vh,50px);height:clamp(30px,6vh,50px);margin-bottom:clamp(4px,1.2vh,12px);animation:in .9s both, glow 3s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px rgba(240,217,154,.95))}}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(1.8rem,min(5.2vw,6.4vh),3.4rem);line-height:1.1;margin:0 0 1vh;
  background:linear-gradient(100deg,var(--ivory) 30%,var(--gold-soft) 50%,var(--ivory) 70%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:in .9s both, shine 5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.05rem,min(4.6vw,3.2vh),1.5rem);color:var(--ivory-dim);margin:0 0 clamp(8px,2.2vh,20px);min-height:1.3em}
#tw::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite;color:var(--gold-soft)}
#tw.done::after{display:none}
@keyframes blink{50%{opacity:0}}

/* PIN dots */
.dots{display:flex;gap:clamp(12px,3vh,20px);justify-content:center;margin:0 0 clamp(8px,2.2vh,20px);height:clamp(14px,2.6vh,22px)}
.dot{width:clamp(14px,2.6vh,22px);height:clamp(14px,2.6vh,22px);border-radius:50%;border:2px solid var(--gold);transition:background .2s,transform .2s,box-shadow .2s}
.dot.on{background:var(--gold-soft);transform:scale(1.15);box-shadow:0 0 14px rgba(240,217,154,.8)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(7px,1.5vh,14px);width:min(320px,100%);padding:clamp(10px,2vh,18px);
  background:rgba(255,255,255,.07);border:1px solid rgba(240,217,154,.45);border-radius:28px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.key{font:inherit;font-weight:600;font-size:clamp(1.3rem,3.9vh,1.9rem);height:clamp(40px,7vh,64px);color:var(--ivory);cursor:pointer;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(240,217,154,.6);border-radius:40px;transition:background .15s,color .15s,transform .1s}
.key:hover{background:rgba(216,180,92,.25)}
.key:active,.key.hit{background:linear-gradient(100deg,var(--gold),var(--gold-soft));color:var(--ink);transform:scale(.94)}
.key.fn{font-size:clamp(1rem,2.8vh,1.3rem);color:var(--gold-soft)}
.key:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hint{margin:clamp(8px,2vh,18px) 0 0;font-size:clamp(.9rem,2.3vh,1.05rem);color:var(--ivory-dim);font-style:italic}
.msg{font-size:clamp(1.05rem,3vh,1.3rem);line-height:1.7;margin:0 0 clamp(12px,3vh,26px)}
button.main{font:inherit;font-size:clamp(1.05rem,3vh,1.3rem);padding:clamp(11px,2vh,16px) 40px;cursor:pointer;letter-spacing:.05em;color:var(--ivory);
  background:transparent;border:2px solid var(--gold);border-radius:40px;transition:background .2s}
button.main:hover{background:rgba(216,180,92,.22)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* Photos */
.duo{display:flex;align-items:center;justify-content:center;gap:0}
.frame{width:clamp(100px,min(21vw,42vh),265px);aspect-ratio:132/170;background:linear-gradient(160deg,var(--gold-soft),var(--gold));padding:6px;border-radius:200px 200px 8px 8px;
  box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 32px rgba(216,180,92,.35);transition:transform .15s ease-out;will-change:transform;animation:in 1.1s both}
.frame .ph{width:100%;height:100%;border-radius:200px 200px 3px 3px;overflow:hidden;background:#5a1020}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.f1{margin-bottom:12vh}.f2{margin-top:12vh;animation-delay:.25s}
.heart{width:clamp(28px,6vh,50px);height:clamp(28px,6vh,50px);flex:none;margin:0 clamp(-14px,-1.6vw,-6px);z-index:2;filter:drop-shadow(0 0 10px rgba(255,120,140,.7));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* Mobile */
@media (max-width:820px){
  body{padding:1.6vh 14px}
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:1.2vh;align-content:center}
  .right{order:-1}
  .left{justify-content:center}
  .frame{width:clamp(76px,min(38vw,19vh),175px)}
  .f1{margin-bottom:3vh}.f2{margin-top:3vh}
  .crest{display:none}
  h1{font-size:clamp(1.6rem,min(8.5vw,5vh),2.6rem)}
}
@media (max-height:560px) and (max-width:820px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*,body::before,body::after{animation:none!important}#sparks,#spot{display:none}}

/* Extra animation */
.pad .key{animation:keyin .55s cubic-bezier(.2,.8,.3,1.3) backwards}
.pad .key:nth-child(1){animation-delay:.55s}.pad .key:nth-child(2){animation-delay:.6s}.pad .key:nth-child(3){animation-delay:.65s}
.pad .key:nth-child(4){animation-delay:.7s}.pad .key:nth-child(5){animation-delay:.75s}.pad .key:nth-child(6){animation-delay:.8s}
.pad .key:nth-child(7){animation-delay:.85s}.pad .key:nth-child(8){animation-delay:.9s}.pad .key:nth-child(9){animation-delay:.95s}
.pad .key:nth-child(10){animation-delay:1s}.pad .key:nth-child(11){animation-delay:1.05s}.pad .key:nth-child(12){animation-delay:1.1s}
@keyframes keyin{from{opacity:0;transform:scale(.5) translateY(18px)}to{opacity:1;transform:none}}
.key{position:relative;overflow:hidden}
.key .rp{position:absolute;border-radius:50%;background:rgba(240,217,154,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.dot.on{animation:pop .35s cubic-bezier(.2,.8,.3,1.6)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1.15)}}
.dots.bad .dot{border-color:#ff8f9c;background:#c0394d;box-shadow:0 0 14px rgba(255,100,120,.8)}
.view.active>.hint{animation:in .9s .6s both, hintpulse 3.2s 1.8s ease-in-out infinite}
@keyframes hintpulse{50%{opacity:.6}}
.frame{position:relative;overflow:hidden}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-130%);animation:sweep 6s ease-in-out infinite;pointer-events:none}
.f2::after{animation-delay:1.2s}
@keyframes sweep{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.fh{position:fixed;z-index:2;pointer-events:none;font-size:18px;color:#ff8fa3;animation:fh 3.2s ease-out forwards;text-shadow:0 0 8px rgba(255,120,140,.8)}
@keyframes fh{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-26vh) scale(1.2)}}
.lock{width:clamp(54px,11vh,90px);height:clamp(54px,11vh,90px);margin-bottom:clamp(6px,2vh,16px);filter:drop-shadow(0 0 12px rgba(240,217,154,.8))}
.shackle{transform-box:fill-box;transform-origin:100% 100%;animation:unlock .9s .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes unlock{to{transform:translateY(-8px) rotate(-28deg)}}
a.main{display:inline-block;text-decoration:none;font:inherit;font-size:clamp(1.05rem,3vh,1.3rem);padding:clamp(12px,2.2vh,17px) 38px;margin-top:clamp(10px,2.4vh,22px);letter-spacing:.05em;color:var(--ink);
  background:linear-gradient(100deg,var(--gold) 0%,var(--gold-soft) 45%,var(--gold) 90%);background-size:220% 100%;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.view.active>a.main{animation:in .9s .7s both, sheen 4s 1.6s ease-in-out infinite, pulse 2.2s 1.6s ease-out infinite}
a.main:hover{transform:translateY(-2px)}
a.main:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes sheen{50%{background-position:100% 0}}
@keyframes pulse{0%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 0 rgba(240,217,154,.7)}100%{box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 22px rgba(240,217,154,0)}}
#open{max-width:480px}
.bloom{display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,16px);width:100%}
.bloom h1{margin:0}
.rose{width:clamp(48px,11vh,92px);height:clamp(48px,11vh,92px);flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(200,60,80,.5));transform-origin:50% 90%;
  animation:bloomin 1.3s .5s cubic-bezier(.2,.8,.3,1.35) backwards, sway 4.5s 1.9s ease-in-out infinite}
.r2{animation-delay:.7s,2.1s}
@keyframes bloomin{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.r2{animation-direction:normal,reverse}

/* Bigger left side */
.view{max-width:460px}
#open{max-width:560px}
.crest{width:clamp(34px,7vh,58px);height:clamp(34px,7vh,58px)}
h1{font-size:clamp(2rem,min(5.8vw,7.4vh),3.9rem)}
.sub{font-size:clamp(1.15rem,min(4.8vw,3.7vh),1.75rem)}
.dots{gap:clamp(12px,3.2vh,24px);height:clamp(16px,3vh,26px)}
.dot{width:clamp(16px,3vh,26px);height:clamp(16px,3vh,26px)}
.pad{width:min(400px,100%);gap:clamp(8px,1.7vh,16px);padding:clamp(12px,2.3vh,22px)}
.key{height:clamp(44px,8vh,74px);font-size:clamp(1.45rem,4.5vh,2.2rem)}
.key.fn{font-size:clamp(1.05rem,3.1vh,1.45rem)}
.hint{font-size:clamp(1rem,2.6vh,1.2rem)}
@media (max-width:820px){
  .view{max-width:420px}
  h1{font-size:clamp(1.8rem,min(9.5vw,5.4vh),3rem)}
  .sub{font-size:clamp(1.1rem,min(5vw,3.4vh),1.5rem)}
  .pad{width:min(380px,100%)}
  .key{height:clamp(42px,7.2vh,66px);font-size:clamp(1.4rem,4.2vh,2rem)}
  .key.fn{font-size:clamp(1rem,2.8vh,1.3rem)}
  .frame{width:clamp(72px,min(36vw,16.5vh),170px)}
  .hint{font-size:clamp(.95rem,2.3vh,1.1rem)}
}
@media (max-width:820px) and (max-height:680px){.hint{display:none}.key{height:clamp(38px,6.8vh,60px)}}

/* Left side bigger again */
.stage{grid-template-columns:1.1fr .9fr}
.view{max-width:580px}
#open{max-width:640px}
.crest{width:clamp(38px,8vh,64px);height:clamp(38px,8vh,64px)}
h1{font-size:clamp(2.2rem,min(6.6vw,8.6vh),4.5rem)}
.sub{font-size:clamp(1.25rem,min(5vw,4.2vh),2rem)}
.dots{gap:clamp(14px,3.6vh,28px);height:clamp(18px,3.4vh,30px)}
.dot{width:clamp(18px,3.4vh,30px);height:clamp(18px,3.4vh,30px)}
.pad{width:min(500px,100%);gap:clamp(9px,2vh,18px);padding:clamp(14px,2.6vh,26px)}
.key{height:clamp(48px,9vh,86px);font-size:clamp(1.6rem,5.2vh,2.6rem)}
.key.fn{font-size:clamp(1.1rem,3.4vh,1.6rem)}
.hint{font-size:clamp(1.05rem,2.9vh,1.35rem)}
@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .view{max-width:440px}
  h1{font-size:clamp(1.9rem,min(10vw,5.8vh),3.2rem)}
  .sub{font-size:clamp(1.15rem,min(5.4vw,3.6vh),1.6rem)}
  .dots{gap:clamp(10px,3vw,18px)}
  .pad{width:min(420px,100%)}
  .key{height:clamp(44px,7.8vh,72px);font-size:clamp(1.5rem,4.5vh,2.2rem)}
  .key.fn{font-size:clamp(1rem,3vh,1.4rem)}
  .frame{width:clamp(68px,min(32vw,14.5vh),150px)}
  .hint{font-size:clamp(.95rem,2.3vh,1.15rem)}
}
@media (max-width:820px) and (max-height:680px){.hint{display:none}.key{height:clamp(38px,7vh,60px)}}

/* Page 3: gift boxes */
.stage{grid-template-columns:1fr!important;grid-template-rows:auto;place-items:center;align-content:center}
.wrap{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:900px}
.wrap h1{animation:in .9s both, shine 5s linear infinite;font-size:clamp(2rem,min(7vw,8.5vh),4.2rem)}
.wrap .sub{animation:in .9s .15s both;margin-bottom:clamp(6px,2vh,22px)}
.row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,4vw,56px);width:100%}
.gift{font:inherit;background:none;border:0;padding:0;cursor:pointer;width:clamp(86px,min(27vw,30vh),210px);position:relative;-webkit-tap-highlight-color:transparent;
  animation:drop 1.1s cubic-bezier(.2,.8,.3,1.3) backwards, float 3.6s ease-in-out infinite}
.gift:nth-child(1){animation-delay:.5s,1.8s}.gift:nth-child(2){animation-delay:.7s,2.2s}.gift:nth-child(3){animation-delay:.9s,2.6s}
@keyframes drop{from{opacity:0;transform:translateY(-70vh) rotate(-12deg) scale(.8)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
.gift svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 0 16px rgba(240,217,154,.35));transition:filter .3s}
.gift:hover svg,.gift:focus-visible svg{filter:drop-shadow(0 0 26px rgba(240,217,154,.85));animation:wiggle .7s}
.gift:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:12px}
@keyframes wiggle{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.lid{transform-box:fill-box;transform-origin:85% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.glow{opacity:0;transition:opacity .6s .2s}
.gift.open{animation:none}
.gift.open .lid{transform:translateY(-38px) rotate(-16deg)}
.gift.open .glow{opacity:1}
.gift.open svg{filter:drop-shadow(0 0 34px rgba(255,214,130,.95))}
.gift.dim{opacity:.25;transform:scale(.9);transition:opacity .6s,transform .6s;animation:none;pointer-events:none}
.row.locked .gift{pointer-events:none}
.tap{margin:clamp(10px,3vh,28px) 0 0;color:var(--ivory-dim);font-style:italic;font-size:clamp(.95rem,2.6vh,1.25rem);animation:in .9s 1.2s both, hintpulse 3.2s 2.2s ease-in-out infinite}

/* Quote card */
#note{position:fixed;left:50%;top:50%;z-index:10;width:min(540px,88vw);padding:clamp(18px,4vh,34px) clamp(18px,4vw,36px);text-align:center;
  background:rgba(43,10,16,.88);border:1.5px solid rgba(240,217,154,.7);border-radius:26px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 40px rgba(216,180,92,.3);opacity:0;pointer-events:none;transform:translate(-50%,-40%) scale(.85);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.3,1.3)}
#note.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);cursor:pointer}
#note .eb{margin:0 0 10px;color:var(--gold-soft);letter-spacing:.26em;text-transform:uppercase;font-size:clamp(.62rem,1.7vh,.8rem)}
#note .q{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.3rem,min(4.6vw,3.6vh),2rem);line-height:1.35;color:var(--ivory)}
#note .go{margin:14px 0 0;color:var(--gold-soft);font-size:clamp(.8rem,2vh,.95rem);letter-spacing:.08em;animation:hintpulse 1.6s ease-in-out infinite}

/* Next Page button */
.next-page{
  display:block;
  margin:clamp(16px,3vh,28px) auto 0;
  padding:13px 34px;
  border:1.5px solid var(--gold-soft);
  border-radius:40px;
  background:linear-gradient(100deg,var(--gold),var(--gold-soft),var(--gold));
  background-size:200% 100%;
  color:var(--ink);
  font-family:'Lora',Georgia,serif;
  font-size:clamp(.95rem,2.5vh,1.15rem);
  font-weight:600;
  letter-spacing:.04em;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 18px rgba(240,217,154,.2);
  transition:transform .25s,box-shadow .25s,background-position .5s;
  animation:nextPulse 2.5s ease-in-out infinite;
}
.next-page:hover{transform:translateY(-3px);background-position:100% 0;box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 25px rgba(240,217,154,.5)}
.next-page:active{transform:scale(.96)}
.next-page:focus-visible{outline:3px solid white;outline-offset:4px}
@keyframes nextPulse{
  0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 0 rgba(240,217,154,.35)}
  50%{box-shadow:0 8px 24px rgba(0,0,0,.3),0 0 0 9px rgba(240,217,154,0)}
}
@media (max-width:820px){
  .wrap h1{font-size:clamp(1.9rem,min(10vw,6vh),3rem)}
  .next-page{margin-top:18px;padding:12px 28px}
}
</style>
</head>
<body>
<div id="spot" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="bxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a42438"/><stop offset="1" stop-color="#5e0f1d"/></linearGradient>
  <linearGradient id="bxg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8304a"/><stop offset="1" stop-color="#701225"/></linearGradient>
  <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d99a"/><stop offset=".55" stop-color="#d8b45c"/><stop offset="1" stop-color="#a77b35"/></linearGradient>
  <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <symbol id="gift" viewBox="0 0 120 140">
    <ellipse cx="60" cy="132" rx="40" ry="5" fill="rgba(0,0,0,.35)"/>
    <rect x="14" y="62" width="92" height="66" rx="4" fill="url(#bxg)" stroke="#f0d99a" stroke-width="1.2"/>
    <rect x="14" y="62" width="92" height="10" fill="rgba(0,0,0,.2)"/>
    <rect x="52" y="62" width="16" height="66" fill="url(#gld)"/>
    <ellipse class="glow" cx="60" cy="48" rx="46" ry="30" fill="url(#gl)"/>
    <g class="lid">
      <rect x="8" y="44" width="104" height="22" rx="4" fill="url(#bxg2)" stroke="#f0d99a" stroke-width="1.2"/>
      <rect x="52" y="44" width="16" height="22" fill="url(#gld)"/>
      <path d="M60 44C40 14 18 28 40 42C48 46 56 46 60 44z" fill="url(#gld)" stroke="#a77b35" stroke-width="1"/>
      <path d="M60 44C80 14 102 28 80 42C72 46 64 46 60 44z" fill="url(#gld)" stroke="#a77b35" stroke-width="1"/>
      <circle cx="60" cy="43" r="5.5" fill="#f0d99a" stroke="#a77b35" stroke-width="1"/>
    </g>
  </symbol>
</defs></svg>

<main class="stage">
  <section class="wrap">
    <h1>Choose Any Box</h1>
    <p class="sub" id="tw" data-t="Three boxes, three little surprises. Pick any one!">&nbsp;</p>
    <div class="row" id="row">
      <button class="gift" type="button" aria-label="Gift box 1"><svg viewBox="0 0 120 140" aria-hidden="true"><use href="#gift" width="120" height="140"/></svg></button>
      <button class="gift" type="button" aria-label="Gift box 2"><svg viewBox="0 0 120 140" aria-hidden="true"><use href="#gift" width="120" height="140"/></svg></button>
      <button class="gift" type="button" aria-label="Gift box 3"><svg viewBox="0 0 120 140" aria-hidden="true"><use href="#gift" width="120" height="140"/></svg></button>
    </div>
    <p class="tap">Tap a box to open it</p>
    <!-- <button class="next-page" type="button" onclick="goToNextPage()">Next Page &#8594;</button> -->
  </section>
</main>

<div id="note" role="status" aria-live="polite">
  <p class="eb">A little note for you</p>
  <p class="q" id="q"></p>
  <!-- <p class="go">Tap to continue &#10084;</p> -->
</div>

<script>
  // Change this if your Page 5 file has a different name.
  var NEXT_PAGE = "Happy_Birthday_Page_6.html";

  var QUOTES = [
    "You’re not getting older, Bhuvan, you’re just upgrading to a classic edition. 😄",
    "Another year older, and you’re still the best thing that ever happened to me.",
    "Fun fact: you’ve been legally adorable for one more whole year. 🎂",
    "I’d share my last fries with you. That’s how serious this love is. 🍟",
    "Your smile is my favorite notification. 💖",
    "May your cake be huge and your diet be completely forgotten today. 🍰",
    "With you, even ordinary days feel like birthdays.",
    "Thank you for being my safe place and my favorite person.",
    "Age is just a number. Yours is just a slightly bigger number this year. 😜",
    "Another trip around the sun, and I’d happily take every single one with you. ☀️",
    "Today the world celebrates the person I celebrate every single day.",
    "Roses are red, violets are blue, I got you a gift, and the gift is me too. 🌹"
  ];

  var $ = function(id){ return document.getElementById(id); };

  // Shuffle quotes so each gift reveals a different message.
  var pool = QUOTES.slice().sort(function(){ return Math.random()-.5; });

  var gifts = document.querySelectorAll(".gift");
  var row = $("row");
  var busy = false;
  var going = false;

  function go(){
    if(going) return;
    going = true;
    if(NEXT_PAGE) location.href = NEXT_PAGE;
  }

  function goToNextPage(){
    go();
  }

  gifts.forEach(function(g,i){
    g.addEventListener("click", function(){
      if(busy) return;
      busy = true;
      row.classList.add("locked");

      g.classList.add("open");
      gifts.forEach(function(o){
        if(o!==g) o.classList.add("dim");
      });

      var r = g.getBoundingClientRect();
      var ox = r.left+r.width/2;
      var oy = r.top+r.height*.35;

      burst(ox,oy);
      hearts(ox,oy);

      $("q").textContent = pool[i % pool.length];

      setTimeout(function(){
        $("note").classList.add("show");
      },750);

      setTimeout(go,5200);
    });
  });

  $("note").addEventListener("click",go);

  function hearts(x,y){
    for(var i=0;i<9;i++) (function(i){
      setTimeout(function(){
        var el=document.createElement("div");
        el.className="fh";
        el.textContent="♥";
        el.style.left=(x-8)+"px";
        el.style.top=(y-8)+"px";
        el.style.setProperty("--dx",((Math.random()-.5)*160)+"px");
        el.style.fontSize=(14+Math.random()*18)+"px";
        document.body.appendChild(el);
        setTimeout(function(){el.remove();},3300);
      },i*110);
    })(i);
  }

  // Sparkles and confetti.
  var cv=$("sparks");
  var cx=cv.getContext("2d");
  var W,H,P=[];

  function size(){
    W=cv.width=innerWidth;
    H=cv.height=innerHeight;
  }
  addEventListener("resize",size);
  size();

  function spark(y){
    return {
      x:Math.random()*W,
      y:y===undefined?H+20:y,
      r:1.5+Math.random()*5,
      v:.25+Math.random()*.7,
      sw:Math.random()*6.28,
      sp:.01+Math.random()*.02,
      a:.15+Math.random()*.5,
      t:Math.random()*6.28,
      conf:false
    };
  }

  for(var i=0;i<45;i++) P.push(spark(Math.random()*H));

  var COL=["#f0d99a","#ff8fa3","#ffffff","#d8b45c","#c24a5a"];

  function draw(){
    cx.clearRect(0,0,W,H);

    for(var i=P.length-1;i>=0;i--){
      var p=P[i];

      if(p.conf){
        p.vy+=.08;
        p.x+=p.vx;
        p.y+=p.vy;
        p.rot+=p.rv;

        if(p.y>H+20){
          P.splice(i,1);
          continue;
        }

        cx.save();
        cx.translate(p.x,p.y);
        cx.rotate(p.rot);
        cx.fillStyle=p.c;
        cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        cx.restore();
      }else{
        p.y-=p.v;
        p.sw+=p.sp;
        p.x+=Math.sin(p.sw)*.4;
        p.t+=.03;

        if(p.y<-20){
          P[i]=spark();
          continue;
        }

        var al=p.a*(.6+.4*Math.sin(p.t));
        var g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
        g.addColorStop(0,"rgba(255,225,160,"+al+")");
        g.addColorStop(1,"rgba(255,225,160,0)");
        cx.fillStyle=g;
        cx.beginPath();
        cx.arc(p.x,p.y,p.r*3,0,6.28);
        cx.fill();
      }
    }

    requestAnimationFrame(draw);
  }

  draw();

  function burst(x,y){
    for(var i=0;i<90;i++){
      P.push({
        conf:true,
        x:x,
        y:y,
        vx:(Math.random()-.5)*11,
        vy:-4-Math.random()*8,
        rot:Math.random()*6,
        rv:(Math.random()-.5)*.4,
        w:6+Math.random()*7,
        h:9+Math.random()*9,
        c:COL[Math.floor(Math.random()*COL.length)]
      });
    }
  }

  // Spotlight follows finger or mouse.
  addEventListener("pointermove",function(e){
    document.documentElement.style.setProperty("--mx",e.clientX+"px");
    document.documentElement.style.setProperty("--my",e.clientY+"px");
  });

  // Typewriter subtitle.
  (function(){
    var el=$("tw");
    var t=el.getAttribute("data-t");
    var i=0;
    el.textContent="";

    setTimeout(function type(){
      el.textContent=t.slice(0,++i);
      if(i<t.length) setTimeout(type,50);
      else el.classList.add("done");
    },700);
  })();
</script>
<script src="music.js"></script>
</body>
</html>
