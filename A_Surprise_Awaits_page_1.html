<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>A Surprise Awaits</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f6f1e7;
        --ivory-dim: #e3cfc6;
        --ink: #2b0a10;
        --gold: #d8b45c;
        --gold-soft: #f0d99a;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Lora", Georgia, serif;
        color: var(--ivory);
        height: 100dvh;
        padding: 2vh 20px;
        background: linear-gradient(
          135deg,
          #3a0711,
          #6a1020,
          #4a0a16,
          #7a1626,
          #3a0711
        );
        background-size: 400% 400%;
        background-attachment: fixed;
        animation: bg 22s ease-in-out infinite;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      @keyframes bg {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 380px;
        height: 380px;
        background: rgba(216, 180, 92, 0.2);
        top: -110px;
        left: -90px;
        animation: orb1 14s ease-in-out infinite;
      }
      body::after {
        width: 440px;
        height: 440px;
        background: rgba(200, 50, 70, 0.28);
        bottom: -150px;
        right: -110px;
        animation: orb2 17s ease-in-out infinite;
      }
      @keyframes orb1 {
        50% {
          transform: translate(90px, 70px);
        }
      }
      @keyframes orb2 {
        50% {
          transform: translate(-90px, -60px);
        }
      }
      #spot {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          420px circle at var(--mx, 70%) var(--my, 40%),
          rgba(255, 190, 120, 0.2),
          transparent 60%
        );
      }
      #sparks {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      }

      /* ---------- layout: details LEFT, photos RIGHT ---------- */
      .stage {
        position: relative;
        z-index: 1;
        height: 100%;
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 4vw;
      }
      .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 0;
      }
      .right {
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 900px;
        min-height: 0;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .view {
        display: none;
        width: 100%;
        max-width: 380px;
      }
      .view.active {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .view.active > * {
        animation: in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .view.active > *:nth-child(2) {
        animation-delay: 0.12s;
      }
      .view.active > *:nth-child(3) {
        animation-delay: 0.24s;
      }
      .view.active > *:nth-child(4) {
        animation-delay: 0.36s;
      }
      .view.active > *:nth-child(5) {
        animation-delay: 0.48s;
      }

      .crest {
        width: clamp(30px, 6vh, 50px);
        height: clamp(30px, 6vh, 50px);
        margin-bottom: clamp(4px, 1.2vh, 12px);
        animation:
          in 0.9s both,
          glow 3s ease-in-out infinite;
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 10px rgba(240, 217, 154, 0.95));
        }
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.8rem, min(5.2vw, 6.4vh), 3.4rem);
        line-height: 1.1;
        margin: 0 0 1vh;
        background: linear-gradient(
          100deg,
          var(--ivory) 30%,
          var(--gold-soft) 50%,
          var(--ivory) 70%
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation:
          in 0.9s both,
          shine 5s linear infinite;
      }
      @keyframes shine {
        from {
          background-position: 120% 0;
        }
        to {
          background-position: -120% 0;
        }
      }
      .sub {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-size: clamp(1.05rem, min(4.6vw, 3.2vh), 1.5rem);
        color: var(--ivory-dim);
        margin: 0 0 clamp(8px, 2.2vh, 20px);
        min-height: 1.3em;
      }
      #tw::after {
        content: "|";
        margin-left: 2px;
        animation: blink 1s steps(1) infinite;
        color: var(--gold-soft);
      }
      #tw.done::after {
        display: none;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* PIN dots */
      .dots {
        display: flex;
        gap: clamp(12px, 3vh, 20px);
        justify-content: center;
        margin: 0 0 clamp(8px, 2.2vh, 20px);
        height: clamp(14px, 2.6vh, 22px);
      }
      .dot {
        width: clamp(14px, 2.6vh, 22px);
        height: clamp(14px, 2.6vh, 22px);
        border-radius: 50%;
        border: 2px solid var(--gold);
        transition:
          background 0.2s,
          transform 0.2s,
          box-shadow 0.2s;
      }
      .dot.on {
        background: var(--gold-soft);
        transform: scale(1.15);
        box-shadow: 0 0 14px rgba(240, 217, 154, 0.8);
      }
      .dots.shake {
        animation: shake 0.45s;
      }
      @keyframes shake {
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-5px);
        }
        80% {
          transform: translateX(5px);
        }
      }

      /* keypad */
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(7px, 1.5vh, 14px);
        width: min(320px, 100%);
        padding: clamp(10px, 2vh, 18px);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(240, 217, 154, 0.45);
        border-radius: 28px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .key {
        font: inherit;
        font-weight: 600;
        font-size: clamp(1.3rem, 3.9vh, 1.9rem);
        height: clamp(40px, 7vh, 64px);
        color: var(--ivory);
        cursor: pointer;
        background: rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(240, 217, 154, 0.6);
        border-radius: 40px;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      .key:hover {
        background: rgba(216, 180, 92, 0.25);
      }
      .key:active,
      .key.hit {
        background: linear-gradient(100deg, var(--gold), var(--gold-soft));
        color: var(--ink);
        transform: scale(0.94);
      }
      .key.fn {
        font-size: clamp(1rem, 2.8vh, 1.3rem);
        color: var(--gold-soft);
      }
      .key:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
      .hint {
        margin: clamp(8px, 2vh, 18px) 0 0;
        font-size: clamp(0.9rem, 2.3vh, 1.05rem);
        color: var(--ivory-dim);
        font-style: italic;
      }
      .msg {
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        line-height: 1.7;
        margin: 0 0 clamp(12px, 3vh, 26px);
      }
      button.main {
        font: inherit;
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        padding: clamp(11px, 2vh, 16px) 40px;
        cursor: pointer;
        letter-spacing: 0.05em;
        color: var(--ivory);
        background: transparent;
        border: 2px solid var(--gold);
        border-radius: 40px;
        transition: background 0.2s;
      }
      button.main:hover {
        background: rgba(216, 180, 92, 0.22);
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      /* photos */
      .duo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      .frame {
        width: clamp(100px, min(21vw, 42vh), 265px);
        aspect-ratio: 132/170;
        background: linear-gradient(160deg, var(--gold-soft), var(--gold));
        padding: 6px;
        border-radius: 200px 200px 8px 8px;
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.5),
          0 0 32px rgba(216, 180, 92, 0.35);
        transition: transform 0.15s ease-out;
        will-change: transform;
        animation: in 1.1s both;
      }
      .frame .ph {
        width: 100%;
        height: 100%;
        border-radius: 200px 200px 3px 3px;
        overflow: hidden;
        background: #5a1020;
      }
      .frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .f1 {
        margin-bottom: 12vh;
      }
      .f2 {
        margin-top: 12vh;
        animation-delay: 0.25s;
      }
      .heart {
        width: clamp(28px, 6vh, 50px);
        height: clamp(28px, 6vh, 50px);
        flex: none;
        margin: 0 clamp(-14px, -1.6vw, -6px);
        z-index: 2;
        filter: drop-shadow(0 0 10px rgba(255, 120, 140, 0.7));
        animation: beat 1.6s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.28);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.2);
        }
      }

      /* ---------- mobile: photos on top, details below ---------- */
      @media (max-width: 820px) {
        body {
          padding: 1.6vh 14px;
        }
        .stage {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          gap: 1.2vh;
          align-content: center;
        }
        .right {
          order: -1;
        }
        .left {
          justify-content: center;
        }
        .frame {
          width: clamp(76px, min(38vw, 19vh), 175px);
        }
        .f1 {
          margin-bottom: 3vh;
        }
        .f2 {
          margin-top: 3vh;
        }
        .crest {
          display: none;
        }
        h1 {
          font-size: clamp(1.6rem, min(8.5vw, 5vh), 2.6rem);
        }
      }
      @media (max-height: 560px) and (max-width: 820px) {
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        body::before,
        body::after {
          animation: none !important;
        }
        #sparks,
        #spot {
          display: none;
        }
      }
      /* ---------- extra animation ---------- */
      .pad .key {
        animation: keyin 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.3) backwards;
      }
      .pad .key:nth-child(1) {
        animation-delay: 0.55s;
      }
      .pad .key:nth-child(2) {
        animation-delay: 0.6s;
      }
      .pad .key:nth-child(3) {
        animation-delay: 0.65s;
      }
      .pad .key:nth-child(4) {
        animation-delay: 0.7s;
      }
      .pad .key:nth-child(5) {
        animation-delay: 0.75s;
      }
      .pad .key:nth-child(6) {
        animation-delay: 0.8s;
      }
      .pad .key:nth-child(7) {
        animation-delay: 0.85s;
      }
      .pad .key:nth-child(8) {
        animation-delay: 0.9s;
      }
      .pad .key:nth-child(9) {
        animation-delay: 0.95s;
      }
      .pad .key:nth-child(10) {
        animation-delay: 1s;
      }
      .pad .key:nth-child(11) {
        animation-delay: 1.05s;
      }
      .pad .key:nth-child(12) {
        animation-delay: 1.1s;
      }
      @keyframes keyin {
        from {
          opacity: 0;
          transform: scale(0.5) translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .key {
        position: relative;
        overflow: hidden;
      }
      .key .rp {
        position: absolute;
        border-radius: 50%;
        background: rgba(240, 217, 154, 0.55);
        transform: scale(0);
        animation: rp 0.6s ease-out forwards;
        pointer-events: none;
      }
      @keyframes rp {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .dot.on {
        animation: pop 0.35s cubic-bezier(0.2, 0.8, 0.3, 1.6);
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
        }
        100% {
          transform: scale(1.15);
        }
      }
      .dots.bad .dot {
        border-color: #ff8f9c;
        background: #c0394d;
        box-shadow: 0 0 14px rgba(255, 100, 120, 0.8);
      }
      .view.active > .hint {
        animation:
          in 0.9s 0.6s both,
          hintpulse 3.2s 1.8s ease-in-out infinite;
      }
      @keyframes hintpulse {
        50% {
          opacity: 0.6;
        }
      }
      .frame {
        position: relative;
        overflow: hidden;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-130%);
        animation: sweep 6s ease-in-out infinite;
        pointer-events: none;
      }
      .f2::after {
        animation-delay: 1.2s;
      }
      @keyframes sweep {
        0%,
        60% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(130%);
        }
      }
      .fh {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        font-size: 18px;
        color: #ff8fa3;
        animation: fh 3.2s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 120, 140, 0.8);
      }
      @keyframes fh {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.5);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), -26vh) scale(1.2);
        }
      }
      .lock {
        width: clamp(54px, 11vh, 90px);
        height: clamp(54px, 11vh, 90px);
        margin-bottom: clamp(6px, 2vh, 16px);
        filter: drop-shadow(0 0 12px rgba(240, 217, 154, 0.8));
      }
      .shackle {
        transform-box: fill-box;
        transform-origin: 100% 100%;
        animation: unlock 0.9s 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) forwards;
      }
      @keyframes unlock {
        to {
          transform: translateY(-8px) rotate(-28deg);
        }
      }
      a.main {
        display: inline-block;
        text-decoration: none;
        font: inherit;
        font-size: clamp(1.05rem, 3vh, 1.3rem);
        padding: clamp(12px, 2.2vh, 17px) 38px;
        margin-top: clamp(10px, 2.4vh, 22px);
        letter-spacing: 0.05em;
        color: var(--ink);
        background: linear-gradient(
          100deg,
          var(--gold) 0%,
          var(--gold-soft) 45%,
          var(--gold) 90%
        );
        background-size: 220% 100%;
        border-radius: 40px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .view.active > a.main {
        animation:
          in 0.9s 0.7s both,
          sheen 4s 1.6s ease-in-out infinite,
          pulse 2.2s 1.6s ease-out infinite;
      }
      a.main:hover {
        transform: translateY(-2px);
      }
      a.main:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
      @keyframes sheen {
        50% {
          background-position: 100% 0;
        }
      }
      @keyframes pulse {
        0% {
          box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.35),
            0 0 0 0 rgba(240, 217, 154, 0.7);
        }
        100% {
          box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.35),
            0 0 0 22px rgba(240, 217, 154, 0);
        }
      }
      #open {
        max-width: 480px;
      }
      .bloom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 1.6vw, 16px);
        width: 100%;
      }
      .bloom h1 {
        margin: 0;
      }
      .rose {
        width: clamp(48px, 11vh, 92px);
        height: clamp(48px, 11vh, 92px);
        flex: none;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45))
          drop-shadow(0 0 12px rgba(200, 60, 80, 0.5));
        transform-origin: 50% 90%;
        animation:
          bloomin 1.3s 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.35) backwards,
          sway 4.5s 1.9s ease-in-out infinite;
      }
      .r2 {
        animation-delay: 0.7s, 2.1s;
      }
      @keyframes bloomin {
        from {
          opacity: 0;
          transform: scale(0) rotate(-40deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }
      .r2 {
        animation-direction: normal, reverse;
      }
      /* ---------- bigger left side ---------- */
      .view {
        max-width: 460px;
      }
      #open {
        max-width: 560px;
      }
      .crest {
        width: clamp(34px, 7vh, 58px);
        height: clamp(34px, 7vh, 58px);
      }
      h1 {
        font-size: clamp(2rem, min(5.8vw, 7.4vh), 3.9rem);
      }
      .sub {
        font-size: clamp(1.15rem, min(4.8vw, 3.7vh), 1.75rem);
      }
      .dots {
        gap: clamp(12px, 3.2vh, 24px);
        height: clamp(16px, 3vh, 26px);
      }
      .dot {
        width: clamp(16px, 3vh, 26px);
        height: clamp(16px, 3vh, 26px);
      }
      .pad {
        width: min(400px, 100%);
        gap: clamp(8px, 1.7vh, 16px);
        padding: clamp(12px, 2.3vh, 22px);
      }
      .key {
        height: clamp(44px, 8vh, 74px);
        font-size: clamp(1.45rem, 4.5vh, 2.2rem);
      }
      .key.fn {
        font-size: clamp(1.05rem, 3.1vh, 1.45rem);
      }
      .hint {
        font-size: clamp(1rem, 2.6vh, 1.2rem);
      }
      @media (max-width: 820px) {
        .view {
          max-width: 420px;
        }
        h1 {
          font-size: clamp(1.8rem, min(9.5vw, 5.4vh), 3rem);
        }
        .sub {
          font-size: clamp(1.1rem, min(5vw, 3.4vh), 1.5rem);
        }
        .pad {
          width: min(380px, 100%);
        }
        .key {
          height: clamp(42px, 7.2vh, 66px);
          font-size: clamp(1.4rem, 4.2vh, 2rem);
        }
        .key.fn {
          font-size: clamp(1rem, 2.8vh, 1.3rem);
        }
        .frame {
          width: clamp(72px, min(36vw, 16.5vh), 170px);
        }
        .hint {
          font-size: clamp(0.95rem, 2.3vh, 1.1rem);
        }
      }
      @media (max-width: 820px) and (max-height: 680px) {
        .hint {
          display: none;
        }
        .key {
          height: clamp(38px, 6.8vh, 60px);
        }
      }
      /* ---------- left side: bigger again ---------- */
      .stage {
        grid-template-columns: 1.1fr 0.9fr;
      }
      .view {
        max-width: 580px;
      }
      #open {
        max-width: 640px;
      }
      .crest {
        width: clamp(38px, 8vh, 64px);
        height: clamp(38px, 8vh, 64px);
      }
      h1 {
        font-size: clamp(2.2rem, min(6.6vw, 8.6vh), 4.5rem);
      }
      .sub {
        font-size: clamp(1.25rem, min(5vw, 4.2vh), 2rem);
      }
      .dots {
        gap: clamp(14px, 3.6vh, 28px);
        height: clamp(18px, 3.4vh, 30px);
      }
      .dot {
        width: clamp(18px, 3.4vh, 30px);
        height: clamp(18px, 3.4vh, 30px);
      }
      .pad {
        width: min(500px, 100%);
        gap: clamp(9px, 2vh, 18px);

      // ----------------------
      var $ = function (id) {
        return document.getElementById(id);S
      };
      [
        ["ph1", PHOTO1],
        ["ph2", PHOTO2],
      ].forEach(function (a) {
        var i = new Image();
        i.alt = "";
        i.src = a[1];
        $(a[0]).appendChild(i);
      });

      var entry = "",
        dots = $("dots"),
        lock = false;
      function renderDots() {
        dots.innerHTML = "";
        for (var i = 0; i < PASSWORD.length; i++) {
          var d = document.createElement("span");
          d.className = "dot" + (i < entry.length ? " on" : "");
          dots.appendChild(d);
        }
      }
      renderDots();
      function show(id) {
        ["gate", "wrong", "open"].forEach(function (v) {
          $(v).classList.toggle("active", v === id);
        });
      }
      function check() {
        if (entry === PASSWORD) {
          lock = true;
          if (NEXT_PAGE) location.href = NEXT_PAGE;
          else {
            show("open");
            lock = false;
          }
        } else {
          lock = true;
          dots.classList.add("shake", "bad");
          setTimeout(function () {
            dots.classList.remove("shake", "bad");
            show("wrong");
            entry = "";
            renderDots();
            lock = false;
          }, 750);
        }
      }
      function press(k) {
        if (lock || !$("gate").classList.contains("active")) return;
        if (k === "back") entry = entry.slice(0, -1);
        else if (k === "clear") entry = "";
        else if (entry.length < PASSWORD.length) entry += k;
        renderDots();
        if (entry.length === PASSWORD.length) setTimeout(check, 250);
      }
      function ripple(b, e) {
        var r = b.getBoundingClientRect(),
          d = Math.max(r.width, r.height) / 3,
          x = e && e.clientX ? e.clientX - r.left : r.width / 2,
          y = e && e.clientY ? e.clientY - r.top : r.height / 2;
        var s = document.createElement("span");
        s.className = "rp";
        s.style.cssText =
          "width:" +
          d +
          "px;height:" +
          d +
          "px;left:" +
          (x - d / 2) +
          "px;top:" +
          (y - d / 2) +
          "px";
        b.appendChild(s);
        setTimeout(function () {
          s.remove();
        }, 600);
      }
      $("pad").addEventListener("click", function (e) {
        var b = e.target.closest(".key");
        if (b) {
          ripple(b, e);
          press(b.getAttribute("data-k"));
        }
      });
      var nx = $("next");
      if (NEXT_PAGE) nx.href = NEXT_PAGE;
      nx.addEventListener("click", function (e) {
        e.preventDefault();
        if (!NEXT_PAGE) {
          $("soon").hidden = false;
          return;
        }
        location.href = NEXT_PAGE;
      });
      $("again").addEventListener("click", function () {
        show("gate");
      });
      addEventListener("keydown", function (e) {
        if (/^[0-9]$/.test(e.key)) {
          press(e.key);
          var b = document.querySelector('.key[data-k="' + e.key + '"]');
          if (b) {
            b.classList.add("hit");
            ripple(b);
            setTimeout(function () {
              b.classList.remove("hit");
            }, 120);
          }
        } else if (e.key === "Backspace") press("back");
        else if (e.key === "Enter" && $("wrong").classList.contains("active"))
          show("gate");
      });

      // Sparkles + confetti
      var cv = $("sparks"),
        cx = cv.getContext("2d"),
        W,
        H,
        P = [];
      function size() {
        W = cv.width = innerWidth;
        H = cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      function spark(y) {
        return {
          x: Math.random() * W,
          y: y === undefined ? H + 20 : y,
          r: 1.5 + Math.random() * 5,
          v: 0.25 + Math.random() * 0.7,
          sw: Math.random() * 6.28,
          sp: 0.01 + Math.random() * 0.02,
          a: 0.15 + Math.random() * 0.5,
          t: Math.random() * 6.28,
          conf: false,
        };
      }
      for (var i = 0; i < 45; i++) P.push(spark(Math.random() * H));
      var COL = ["#f0d99a", "#ff8fa3", "#ffffff", "#d8b45c", "#c24a5a"];
      function draw() {
        cx.clearRect(0, 0, W, H);
        for (var i = P.length - 1; i >= 0; i--) {
          var p = P[i];
          if (p.conf) {
            p.vy += 0.08;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.rv;
            if (p.y > H + 20) {
              P.splice(i, 1);
              continue;
            }
            cx.save();
            cx.translate(p.x, p.y);
            cx.rotate(p.rot);
            cx.fillStyle = p.c;
            cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            cx.restore();
          } else {
            p.y -= p.v;
            p.sw += p.sp;
            p.x += Math.sin(p.sw) * 0.4;
            p.t += 0.03;
            if (p.y < -20) {
              P[i] = spark();
              continue;
            }
            var al = p.a * (0.6 + 0.4 * Math.sin(p.t)),
              g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
            g.addColorStop(0, "rgba(255,225,160," + al + ")");
            g.addColorStop(1, "rgba(255,225,160,0)");
            cx.fillStyle = g;
            cx.beginPath();
            cx.arc(p.x, p.y, p.r * 3, 0, 6.28);
            cx.fill();
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
      function burst() {
        for (var i = 0; i < 110; i++)
          P.push({
            conf: true,
            x: W / 2,
            y: H * 0.45,
            vx: (Math.random() - 0.5) * 12,
            vy: -4 - Math.random() * 9,
            rot: Math.random() * 6,
            rv: (Math.random() - 0.5) * 0.4,
            w: 6 + Math.random() * 7,
            h: 9 + Math.random() * 9,
            c: COL[Math.floor(Math.random() * COL.length)],
          });
      }

      // Spotlight + 3D tilt (follows finger/mouse, sways on its own when idle)
      var frames = document.querySelectorAll(".frame"),
        last = 0;
      function move(x, y) {
        document.documentElement.style.setProperty("--mx", x + "px");
        document.documentElement.style.setProperty("--my", y + "px");
        var nx = x / innerWidth - 0.5,
          ny = y / innerHeight - 0.5;
        frames.forEach(function (f, i) {
          f.style.transform =
            "rotate(" +
            (i ? 4 : -4) +
            "deg) rotateY(" +
            nx * 22 +
            "deg) rotateX(" +
            -ny * 18 +
            "deg)";
        });
      }
      addEventListener("pointermove", function (e) {
        last = Date.now();
        move(e.clientX, e.clientY);
      });
      setInterval(function () {
        if (Date.now() - last < 2500) return;
        var t = Date.now() / 1600;
        move(
          innerWidth * (0.6 + 0.25 * Math.sin(t)),
          innerHeight * (0.42 + 0.12 * Math.cos(t * 0.8)),
        );
      }, 40);

      // Little hearts floating up from the big heart
      var hh = document.querySelector(".heart");
      setInterval(function () {
        if (document.hidden) return;
        var r = hh.getBoundingClientRect(),
          el = document.createElement("div");
        el.className = "fh";
        el.textContent = "\u2665";
        el.style.left = r.left + r.width / 2 - 8 + "px";
        el.style.top = r.top + r.height / 2 - 8 + "px";
        el.style.setProperty("--dx", (Math.random() - 0.5) * 90 + "px");
        el.style.fontSize = 12 + Math.random() * 14 + "px";
        document.body.appendChild(el);
        setTimeout(function () {
          el.remove();
        }, 3300);
      }, 1100);

      // Typewriter
      (function () {
        var el = $("tw"),
          t = el.getAttribute("data-t"),
          i = 0;
        el.textContent = "";
        setTimeout(function type() {
          el.textContent = t.slice(0, ++i);
          if (i < t.length) setTimeout(type, 55);
          else el.classList.add("done");
        }, 900);
      })();
    </script>
