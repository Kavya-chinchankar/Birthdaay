<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Reasons</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gifts.css" />
    <style>
      .rc {
        width: min(86vw, 420px);
        min-height: clamp(120px, 22vh, 190px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px;
        border-radius: 26px;
        cursor: pointer;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1.5px solid rgba(240, 217, 154, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(1.3rem, 4.6vw, 1.8rem);
        line-height: 1.35;
        color: #fff3e2;
        margin: 6px 0 14px;
        font-weight: 500;
      }
      .rc.in {
        animation: in 0.6s both;
      }
      .cnt {
        color: var(--gold-soft);
        font-size: 0.95rem;
        margin-bottom: 14px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="spot" aria-hidden="true"></div>
    <canvas id="sparks" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="wrap">
      <div class="eyebrow">why you are loved</div>
      <h1>Reasons I love you</h1>
      <div
        class="rc tap in"
        id="c"
        tabindex="0"
        role="button"
        aria-label="Next reason"
      ></div>
      <div class="cnt" id="k"></div>
      <div class="hint" id="h">Tap the card</div>
      <div class="btns" id="b">
        <a class="btn gold" href="Happy_Birthday_Page_3.2.html" data-nav
          >Next →</a
        >
      </div>
    </div>
    <script src="gifts.js"></script>
    <script src="music.js"></script>
    <script>
      var R = [
          "Your kindness makes everyone around you feel safe.",
          "Your honesty is rare. I never have to guess with you.",
          "Your smile can fix my worst day.",
          "You chase your dreams quietly and bravely.",
          "You make ordinary moments feel special.",
          "You care in all the little things.",
          "You make me want to be a better person.",
          "Being with you feels like home.",
        ],
        i = 0,
        c = document.getElementById("c");
      function show() {
        c.classList.remove("in");
        void c.offsetWidth;
        c.textContent = R[i];
        c.classList.add("in");
        document.getElementById("k").textContent = i + 1 + " / " + R.length;
        G.hearts(c, 6, "♥");
      }
      function nx() {
        if (i < R.length - 1) {
          i++;
          show();
          if (i == R.length - 1) {
            document.getElementById("h").style.display = "none";
            document.getElementById("b").classList.add("show");
          }
        }
      }
      c.addEventListener("click", nx);
      c.addEventListener("keydown", function (e) {
        if (e.key == "Enter" || e.key == " ") nx();
      });
      show();
    </script>
  </body>
</html>
