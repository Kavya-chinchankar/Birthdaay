<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Little Universe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f6f1e7;
        --gold: #d8b45c;
        --gold-soft: #f0d99a;
        --rose: #ff7a93;
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        margin: 0;
      }
      body {
        color: var(--ivory);
        overflow-x: hidden;
        font-family: Georgia, serif;
        background:
          radial-gradient(1200px 700px at 20% 0%, #7a1626 0%, transparent 60%),
          radial-gradient(900px 700px at 90% 40%, #5a0e1b 0%, transparent 60%),
          linear-gradient(180deg, #2b0a10, #3a0711 50%, #220509);
        background-attachment: fixed;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
      }
      #bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 100%;
        transform-origin: 0 50%;
        transform: scaleX(0);
        background: linear-gradient(90deg, var(--gold), var(--rose));
        z-index: 60;
      }

      /* ---------- HEADING ---------- */
      .head {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 7vh);
        left: 0;
        right: 0;
        text-align: center;
        z-index: 3;
        pointer-events: none;
        padding: 0 16px;
      }
      .head h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: clamp(2.4rem, 11vw, 4.8rem);
        line-height: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.04em;
      }
      .head .w {
        display: block;
        overflow: hidden;
        padding: 0.02em 0.08em 0.14em;
      }
      .head .w i {
        font-style: normal;
        display: inline-block;
        transform: translateY(110%) rotate(8deg);
        opacity: 0;
        animation:
          rise 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) forwards,
          shim 5s linear 3s infinite;
        background: linear-gradient(
          100deg,
          var(--ivory) 30%,
          var(--gold-soft) 50%,
          var(--ivory) 70%
        );
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @keyframes rise {
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes shim {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      .head p {
        margin: 0.5em 0 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-size: clamp(1.05rem, 4vw, 1.35rem);
        color: #ecdccf;
        opacity: 0;
        animation: fadein 1.2s 2s forwards;
      }
      @keyframes fadein {
        to {
          opacity: 1;
        }
      }
      .head .tw {
        display: inline-block;
        color: var(--gold-soft);
        margin: 0 0.4em;
        animation: tw 2s ease-in-out infinite;
      }
      @keyframes tw {
        50% {
          transform: scale(1.4) rotate(20deg);
          opacity: 0.6;
        }
      }

      /* ---------- 3D RING ---------- */
      .ringwrap {
        position: relative;
        height: 100svh;
        min-height: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1300px;
        overflow: hidden;
        touch-action: pan-y;
        cursor: grab;
      }
      .ringwrap:active {
        cursor: grabbing;
      }
      .ringwrap::before {
        content: "";
        position: absolute;
        width: min(90vw, 620px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(240, 217, 154, 0.28),
          rgba(255, 122, 147, 0.12) 45%,
          transparent 70%
        );
        filter: blur(10px);
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.18);
          opacity: 0.7;
        }
      }
      .ring {
        position: relative;
        transform-style: preserve-3d;
        width: var(--w);
        height: var(--h);
      }
      .card {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        padding: 6px;
        background: linear-gradient(145deg, #f0d99a, #b98f3c 50%, #f0d99a);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        backface-visibility: visible;
        -webkit-box-reflect: below 6px
          linear-gradient(transparent 70%, rgba(255, 255, 255, 0.18));
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 9px;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      .drift {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
        left: 0;
        right: 0;
        text-align: center;
        color: var(--gold-soft);
        font-size: 1.5rem;
        animation: bob 1.8s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes bob {
        50% {
          transform: translateY(9px);
        }
      }

      /* ---------- SCRAPBOOK ---------- */
      .book {
        position: relative;
        max-width: 980px;
        margin: 0 auto;
        padding: 8vh 18px 14vh;
        columns: 2;
        column-gap: 22px;
      }
      @media (min-width: 760px) {
        .book {
          columns: 3;
          column-gap: 34px;
        }
      }
      .pol {
        position: relative;
        break-inside: avoid;
        margin: 0 0 40px;
        padding: 9px 9px 14px;
        background: var(--ivory);
        border-radius: 4px;
        cursor: zoom-in;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        transform: translateY(70px) rotate(0deg) scale(0.92);
        opacity: 0;
        transition:
          transform 1.2s cubic-bezier(0.2, 0.9, 0.2, 1),
          opacity 1s;
        -webkit-tap-highlight-color: transparent;
      }
      .pol.in {
        opacity: 1;
        transform: translateY(var(--y, 0)) rotate(var(--r, 0deg));
      }
      .pol.in:hover {
        transform: translateY(calc(var(--y, 0px) - 8px)) rotate(0deg)
          scale(1.04);
        z-index: 5;
      }
      .pol.tall {
        padding-bottom: 34px;
      }
      .pol img {
        display: block;
        width: 100%;
        border-radius: 2px;
        filter: blur(14px) sepia(1) brightness(1.3);
        transition: filter 2.2s ease 0.3s;
      }
      .pol.in img {
        filter: none;
      }
      .pol::before {
        content: "";
        position: absolute;
        top: -12px;
        left: 50%;
        width: 70px;
        height: 24px;
        margin-left: -35px;
        transform: rotate(var(--tr, -4deg));
        background: rgba(240, 217, 154, 0.55);
        backdrop-filter: blur(2px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .pol::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 4px;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 38%,
          rgba(255, 245, 210, 0.45) 50%,
          transparent 62%
        );
        transform: translateX(-130%);
      }
      .pol.in::after {
        animation: sweep 1.5s 1.1s ease forwards;
      }
      @keyframes sweep {
        to {
          transform: translateX(130%);
        }
      }
      .stk {
        position: absolute;
        font-size: 2rem;
        line-height: 1;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
        pointer-events: none;
        animation: wob 4s ease-in-out infinite;
        z-index: 2;
      }
      @keyframes wob {
        0%,
        100% {
          transform: rotate(var(--sr, -10deg)) translateY(0);
        }
        50% {
          transform: rotate(calc(var(--sr, -10deg) + 12deg)) translateY(-6px);
        }
      }
      .ph {
        background: linear-gradient(135deg, #6a1020, #d8b45c33);
        aspect-ratio: 3/4;
      }

      /* free floating stickers */
      .float {
        position: fixed;
        font-size: 1.6rem;
        opacity: 0.75;
        pointer-events: none;
        z-index: 2;
        animation: fl linear infinite;
        filter: drop-shadow(0 0 8px rgba(240, 217, 154, 0.6));
      }
      @keyframes fl {
        0% {
          transform: translateY(105vh) rotate(0);
          opacity: 0;
        }
        10% {
          opacity: 0.8;
        }
        90% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(-15vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* ---------- LIGHTBOX ---------- */
      .lb {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(25, 3, 8, 0.92);
        backdrop-filter: blur(8px);
      }
      .lb.on {
        display: flex;
        animation: lbin 0.4s ease;
      }
      @keyframes lbin {
        from {
          opacity: 0;
        }
      }
      .lb img {
        max-width: 92vw;
        max-height: 84vh;
        border: 8px solid var(--ivory);
        border-radius: 4px;
        box-shadow: 0 0 80px rgba(240, 217, 154, 0.35);
        animation: pop 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0.85) rotate(-3deg);
          opacity: 0;
        }
      }
      .lb button {
        position: absolute;
        background: none;
        border: 0;
        color: var(--gold-soft);
        font-size: 2.4rem;
        cursor: pointer;
        padding: 14px;
        text-shadow: 0 0 12px rgba(240, 217, 154, 0.7);
      }
      .lb .x {
        top: calc(env(safe-area-inset-top, 0px) + 6px);
        right: 8px;
      }
      .lb .p {
        left: 4px;
        top: 50%;
      }
      .lb .n {
        right: 4px;
        top: 50%;
      }

      /* ---------- NEXT PAGE BUTTON ---------- */
      .nextwrap {
        position: relative;
        z-index: 4;
        display: flex;
        justify-content: center;
        padding: 2vh 18px calc(env(safe-area-inset-bottom, 0px) + 14vh);
      }
      .nextbtn {
        display: inline-flex;
        align-items: center;
        gap: 0.6em;
        padding: 16px 34px;
        border-radius: 999px;
        text-decoration: none;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
        color: #3a0711;
        background: linear-gradient(145deg, #f0d99a, #d8b45c 50%, #f0d99a);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.5),
          0 0 28px rgba(240, 217, 154, 0.45);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        animation: breathe2 3s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
      }
      .nextbtn:hover {
        transform: translateY(-3px) scale(1.05);
      }
      .nextbtn .ar {
        display: inline-block;
        transition: transform 0.3s ease;
      }
      .nextbtn:hover .ar {
        transform: translateX(6px);
      }
      @keyframes breathe2 {
        50% {
          box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.5),
            0 0 44px rgba(255, 122, 147, 0.6);
        }
      }
      :focus-visible {
        outline: 2px solid var(--gold-soft);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <canvas id="fx"></canvas>

    <section class="ringwrap" id="rw">
      <div class="head">
        <h1 id="ttl" aria-label="The Boy Behind My Favourite Memories"></h1>
        <p>
          <span class="tw">✦</span>Every Picture Tells Me Why You're Special<span class="tw"
            >✦</span
          >
        </p>
      </div>
      <div class="ring" id="ring"></div>
      <div class="drift">⌄</div>
    </section>
    <main class="book" id="book"></main>

    <div class="nextwrap">
      <a class="nextbtn" href="Happy_Birthday_Page_3.html"
        >Next <span class="ar">→</span></a
      >
    </div>

    <div class="lb" id="lb" role="dialog" aria-label="Photo viewer">
      <button class="x" aria-label="Close">✕</button
      ><button class="p" aria-label="Previous">‹</button>
      <img id="lbi" alt="" /><button class="n" aria-label="Next">›</button>
    </div>

    <script>
      /* ===== your photos (same filenames as the original page; keep the "photos" folder next to this file) ===== */
      /* To add more pictures: just add another filename to this list (photos/NAME.jpg).
         The ring, the scrapbook, the lightbox and the stickers all pick it up automatically. */
      var P = [
        "hall",
        "bike1",
        "bike2",
        "hill",
        "hill2",
        "bw",
        "walk",
        "water",
        "plaid",
        "coffee",
      ].map(function (n) {
        return "photos/" + n + ".jpg";
      });
      var $ = function (i) {
        return document.getElementById(i);
      };
      var STK = ["✨", "💖", "🦋", "🌸", "⭐", "🎞️", "📷", "🌷", "💫", "🤍"];

      /* heading letters */
      (function () {
        var T = $("ttl"),
          n = 0;
        ["The Man Behind", "My Favourite Memories"].forEach(function (w) {
          var d = document.createElement("span");
          d.className = "w";
          d.setAttribute("aria-hidden", "true");
          w.split("").forEach(function (ch) {
            var i = document.createElement("i");
            i.textContent = ch === " " ? "\u00a0" : ch;
            i.style.animationDelay =
              0.4 + n * 0.06 + "s," + (3 + n * 0.05) + "s";
            n++;
            d.appendChild(i);
          });
          T.appendChild(d);
        });
      })();

      /* ===== 3D ring ===== */
      var ring = $("ring"),
        rw = $("rw"),
        cards = [];
      P.forEach(function (s) {
        var c = document.createElement("div");
        c.className = "card";
        var i = new Image();
        i.src = s;
        i.alt = "";
        i.onerror = function () {
          c.style.background = "linear-gradient(135deg,#6a1020,#d8b45c)";
        };
        c.appendChild(i);
        ring.appendChild(c);
        cards.push(c);
      });
      function layout() {
        var w = Math.min(innerWidth * 0.36, 200),
          h = w * 1.28,
          R = (w / 2 / Math.tan(Math.PI / P.length)) * 1.18;
        ring.style.setProperty("--w", w + "px");
        ring.style.setProperty("--h", h + "px");
        cards.forEach(function (c, k) {
          c.style.transform =
            "rotateY(" + (k * 360) / P.length + "deg) translateZ(" + R + "px)";
        });
      }
      layout();
      addEventListener("resize", layout);
      var ang = 0,
        vel = 0.25,
        drag = false,
        lx = 0;
      rw.addEventListener("pointerdown", function (e) {
        drag = true;
        lx = e.clientX;
      });
      addEventListener("pointerup", function () {
        drag = false;
      });
      addEventListener("pointermove", function (e) {
        if (!drag) return;
        var d = e.clientX - lx;
        lx = e.clientX;
        ang += d * 0.4;
        vel = d * 0.4;
      });
      (function spin() {
        if (!drag) {
          ang += vel;
          vel += (0.25 - vel) * 0.02;
        }
        ring.style.transform = "rotateX(-6deg) rotateY(" + ang + "deg)";
        requestAnimationFrame(spin);
      })();

      /* ===== scrapbook ===== */
      var book = $("book");
      P.forEach(function (s, k) {
        var f = document.createElement("figure");
        f.className = "pol" + (k % 3 == 1 ? " tall" : "");
        f.style.margin = "0 0 40px";
        f.style.setProperty("--r", (Math.random() * 8 - 4).toFixed(1) + "deg");
        f.style.setProperty(
          "--tr",
          (Math.random() * 12 - 6).toFixed(1) + "deg",
        );
        f.style.setProperty("--y", (k % 2 ? 18 : 0) + "px");
        var i = new Image();
        i.src = s;
        i.alt = "";
        i.loading = "lazy";
        i.onerror = function () {
          i.replaceWith(
            Object.assign(document.createElement("div"), { className: "ph" }),
          );
        };
        f.appendChild(i);
        if (k % 2 == 0 || k % 3 == 0) {
          var t = document.createElement("span");
          t.className = "stk";
          t.textContent = STK[(k * 3 + Math.floor(k / STK.length)) % STK.length];
          t.style.cssText +=
            "--sr:" +
            (Math.random() * 30 - 15) +
            "deg;" +
            (k % 2 ? "right" : "left") +
            ":-14px;bottom:" +
            (8 + Math.random() * 30) +
            "px;animation-delay:-" +
            Math.random() * 4 +
            "s";
          f.appendChild(t);
        }
        f.tabIndex = 0;
        f.addEventListener("click", function () {
          open(k);
        });
        f.addEventListener("keydown", function (e) {
          if (e.key === "Enter") open(k);
        });
        book.appendChild(f);
      });
      var io = new IntersectionObserver(
        function (es) {
          es.forEach(function (e) {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              burst(e.target);
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.2 },
      );
      book.querySelectorAll(".pol").forEach(function (el) {
        io.observe(el);
      });

      /* drifting stickers */
      for (var q = 0; q < 10; q++) {
        var d = document.createElement("div");
        d.className = "float";
        d.textContent = STK[q % STK.length];
        d.style.left = Math.random() * 95 + "vw";
        d.style.fontSize = 1 + Math.random() * 1.2 + "rem";
        d.style.animationDuration = 14 + Math.random() * 14 + "s";
        d.style.animationDelay = "-" + Math.random() * 20 + "s";
        document.body.appendChild(d);
      }

      /* ===== lightbox ===== */
      var lb = $("lb"),
        lbi = $("lbi"),
        cur = 0,
        sx = 0;
      function show() {
        lbi.style.animation = "none";
        void lbi.offsetWidth;
        lbi.style.animation = "";
        lbi.src = P[cur];
      }
      function open(k) {
        cur = k;
        show();
        lb.classList.add("on");
      }
      function step(d) {
        cur = (cur + d + P.length) % P.length;
        show();
      }
      lb.querySelector(".x").onclick = function () {
        lb.classList.remove("on");
      };
      lb.querySelector(".p").onclick = function (e) {
        e.stopPropagation();
        step(-1);
      };
      lb.querySelector(".n").onclick = function (e) {
        e.stopPropagation();
        step(1);
      };
      lb.addEventListener("click", function (e) {
        if (e.target === lb) lb.classList.remove("on");
      });
      lb.addEventListener(
        "touchstart",
        function (e) {
          sx = e.touches[0].clientX;
        },
        { passive: true },
      );
      lb.addEventListener("touchend", function (e) {
        var d = e.changedTouches[0].clientX - sx;
        if (Math.abs(d) > 50) step(d < 0 ? 1 : -1);
      });
      addEventListener("keydown", function (e) {
        if (!lb.classList.contains("on")) return;
        if (e.key === "Escape") lb.classList.remove("on");
        if (e.key === "ArrowRight") step(1);
        if (e.key === "ArrowLeft") step(-1);
      });

      /* ===== sparkles: twinkling stars + touch/mouse trail + bursts ===== */
      var c = $("fx"),
        x = c.getContext("2d"),
        W,
        H,
        dpr = Math.min(2, devicePixelRatio || 1),
        stars = [],
        sp = [];
      function rs() {
        W = innerWidth;
        H = innerHeight;
        c.width = W * dpr;
        c.height = H * dpr;
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      rs();
      addEventListener("resize", rs);
      for (var i = 0; i < 70; i++)
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.6 + Math.random() * 1.8,
          p: Math.random() * 6,
          s: 0.01 + Math.random() * 0.03,
        });
      function star(px, py, r, col, a) {
        x.globalAlpha = a;
        x.fillStyle = col;
        x.beginPath();
        for (var i = 0; i < 8; i++) {
          var rad = i % 2 ? r * 0.28 : r,
            t = (i * Math.PI) / 4;
          x.lineTo(px + Math.cos(t) * rad, py + Math.sin(t) * rad);
        }
        x.closePath();
        x.fill();
      }
      function add(px, py, n, spread) {
        for (var i = 0; i < n; i++) {
          var a = Math.random() * 6.28,
            v = Math.random() * spread;
          sp.push({
            x: px,
            y: py,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v - 0.3,
            l: 1,
            r: 3 + Math.random() * 6,
            c: Math.random() < 0.35 ? "#ff9db0" : "#f0d99a",
          });
        }
      }
      function burst(el) {
        var r = el.getBoundingClientRect();
        add(
          r.left + r.width / 2,
          Math.min(Math.max(r.top + r.height / 2, 0), H),
          16,
          2.6,
        );
      }
      addEventListener("pointermove", function (e) {
        add(e.clientX, e.clientY, 1, 0.8);
      });
      addEventListener("pointerdown", function (e) {
        add(e.clientX, e.clientY, 14, 3);
      });
      (function t() {
        x.clearRect(0, 0, W, H);
        stars.forEach(function (s) {
          s.p += s.s;
          star(
            s.x,
            s.y,
            s.r * 2.2,
            "#f0d99a",
            0.25 + 0.55 * Math.abs(Math.sin(s.p)),
          );
        });
        for (var i = sp.length - 1; i >= 0; i--) {
          var p = sp[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.03;
          p.l -= 0.02;
          if (p.l <= 0) {
            sp.splice(i, 1);
            continue;
          }
          star(p.x, p.y, p.r * p.l, p.c, p.l);
        }
        x.globalAlpha = 1;
        requestAnimationFrame(t);
      })();

      /* progress bar */
      addEventListener(
        "scroll",
        function () {
          var m = document.documentElement.scrollHeight - innerHeight;
          $("bar").style.transform =
            "scaleX(" + (m > 0 ? scrollY / m : 0) + ")";
        },
        { passive: true },
      );
    </script>
    <script src="music.js"></script>
  </body>
</html>
